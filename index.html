/* ══════════════════ CONTAS A PAGAR ══════════════════ */
/* Um repasse ao cliente só pode ser pago depois que a parcela correspondente for conciliada.
   O sinal é lido da própria parcela, então nunca sai do lugar. */
function liberacao(c){
  if (!c.PARCELA_ID) return {tipo:'na'};
  const p = parcDe(c.PARCELA_ID);
  if (!p) return {tipo:'na'};
  return p.STATUS === 'Recebida'
    ? {tipo:'ok', p, titulo:'Recebido em ' + dataBR(p.DATA_CREDITO) + ' — liberado para pagamento'}
    : {tipo:'nao', p, titulo:'Parcela ainda não conciliada — aguardando o crédito de ' + moeda(p.VALOR)};
}
function selo(c){
  const s = liberacao(c);
  if (s.tipo === 'na') return '<span class="mini">—</span>';
  return s.tipo === 'ok'
    ? '<span class="selo ok" title="'+esc(s.titulo)+'">✓</span>'
    : '<span class="selo nao" title="'+esc(s.titulo)+'">✕</span>';
}
/* conta recorrente ainda sem boleto: valor em branco */
const semValorCP = c => c.STATUS !== 'Pago' && !n(c.VALOR);
function filtraLib(c, f){
  if (!f) return true;
  if (f === 'sem') return semValorCP(c);
  const t = liberacao(c).tipo;
  return f === 'nao' ? t === 'nao' : t !== 'nao';
}
/* botões de recebido / não recebido / todos, com a contagem de cada um */
function botoesLib(base){
  const f = FILTROS.fLib || '';
  const op = [
    ['',    'Todos',            base.length],
    ['ok',  '✓ Recebidos',      base.filter(c => filtraLib(c,'ok')).length],
    ['nao', '✕ Não recebidos',  base.filter(c => filtraLib(c,'nao')).length],
    ['sem', 'Sem boleto',       base.filter(c => filtraLib(c,'sem')).length]
  ];
  return '<div class="seg" role="group" aria-label="Filtrar por recebimento">'
    + op.map(([k,rot,qtd]) => '<button class="'+(f===k?'on':'')+' k'+(k||'todos')+'" onclick="setF(\'fLib\',\''+k+'\')">'
        + esc(rot) + '<span>'+qtd+'</span></button>').join('')
    + '</div>';
}
function origemCP(c){
  const partes = [];
  if (c.ORIGEM && c.ORIGEM !== 'Manual') partes.push(c.ORIGEM);
  const lb = liberacao(c);
  if (lb.tipo === 'ok') partes.push('recebido em ' + dataBR(lb.p.DATA_CREDITO));
  else if (lb.tipo === 'nao') partes.push('aguardando recebimento');
  return partes.length ? '<div class="mini">'+esc(partes.join(' · '))+'</div>' : '';
}
function telaPagar(){
  const t = FILTROS.busca, mes = FILTROS.fMesP || '';
  const hj = hoje();
  // contas pagas saem daqui e vão para a aba Contas pagas
  const base = (DB.CONTAS_PAGAR||[])
    .filter(c => c.STATUS !== 'Pago')
    .filter(c => casa(c, ['DESCRICAO','FAVORECIDO','CATEGORIA'], t))
    .filter(c => !mes || mesDe(c.VENCIMENTO) === mes);
  const L = base.filter(c => filtraLib(c, FILTROS.fLib))
    .sort((a,b) => String(a.VENCIMENTO).localeCompare(String(b.VENCIMENTO)));
  const abertas = L;
  const atraso = abertas.filter(c => c.VENCIMENTO < hj && liberacao(c).tipo !== 'nao');
  const liberadas = abertas.filter(c => liberacao(c).tipo !== 'nao');
  const travadas = abertas.filter(c => liberacao(c).tipo === 'nao');
  const semBoleto = abertas.filter(semValorCP);

  return cabec('Contas a pagar', 'Apenas contas em aberto. ✕ = a parcela do cliente ainda não caiu; ✓ = já recebemos e o repasse pode ser pago. Ao conciliar o débito, a conta vai para Contas pagas.',
      '<button class="btn" onclick="formCP()">Lançar nova conta</button>'
    + '<button class="btn sec" onclick="exportarCSV(\'contas-a-pagar\')">Exportar CSV</button>')
    + '<div class="kpis">'
    + kpi('Em aberto', moeda(abertas.reduce((s,c)=>s+n(c.VALOR),0)), abertas.length + ' conta(s)', 'b')
    + kpi('Vencidas', moeda(atraso.reduce((s,c)=>s+n(c.VALOR),0)), atraso.length + ' em atraso', atraso.length ? 'n' : '')
    + kpi('Liberadas para pagamento', moeda(liberadas.reduce((s,c)=>s+n(c.VALOR),0)), liberadas.length + ' conta(s) com ✓', 'p')
    + kpi('Aguardando recebimento', moeda(travadas.reduce((s,c)=>s+n(c.VALOR),0)), travadas.length + ' repasse(s) com ✕', travadas.length ? 'n' : '')
    + kpi('Boletos não recebidos', semBoleto.length, 'contas recorrentes ainda sem valor', semBoleto.length ? 'b' : '')
    + '</div>'
    + '<div class="filtros">' + campoBusca('Descrição, favorecido…') + selMes('fMesP', mes)
    + '</div>' + botoesLib(base)
    + '<div class="card"><div class="tw"><table><thead><tr><th style="text-align:center">Recebido</th><th>Vencimento</th><th>Descrição</th><th>Favorecido</th>'
    + '<th>Categoria</th><th class="num">Valor</th><th></th></tr></thead><tbody>'
    + (L.length ? L.map(c => '<tr'+(c.VENCIMENTO<hj && liberacao(c).tipo!=='nao' ? ' class="grifo"' : '')+'>'
      + '<td style="text-align:center">'+selo(c)+'</td>'
      + '<td>'+dataBR(c.VENCIMENTO)+'</td><td'+(c.OBS?' title="'+esc(c.OBS)+'"':'')+'>'+esc(c.DESCRICAO) + origemCP(c) + '</td>'
      + '<td>'+esc(c.FAVORECIDO||'—')+'</td><td>'+esc(c.CATEGORIA||'—')+'</td>'
      + '<td class="num">'+(semValorCP(c) ? '<span class="tag t-pend">boleto não recebido</span>' : nMoeda(c.VALOR))+'</td>'
      + '<td style="text-align:right;white-space:nowrap">'
      + '<button class="btn sm sec" onclick="formCP(\''+c.ID+'\')">Editar</button> '
      + '<button class="btn sm per" onclick="apagarSimples(\'CONTAS_PAGAR\',\''+c.ID+'\')">Excluir</button>'
      + '</td></tr>').join('')
      : '<tr><td colspan="7">'+vazio('Nenhuma conta a pagar','O repasse ao cliente entra aqui já no lançamento do acordo, com ✕, e ganha o ✓ quando a parcela é conciliada.')+'</td></tr>')
    + '</tbody></table></div></div>';
}

/* ao escolher um favorecido já cadastrado, puxa a categoria padrão dele */
function favEscolhido(){
  const f = (DB.FAVORECIDOS||[]).find(x => x.NOME.toLowerCase() === val('cpFav').toLowerCase());

function toggleRec(){
  const box = document.getElementById('boxRec');
  if (!val('cpRec')){ box.innerHTML = ''; REC_TMP = []; return; }
  const dia = Number(String(val('cpVenc')).slice(8,10)) || new Date().getDate();
  box.innerHTML = '<div class="secao-form">Contas recorrentes</div>'
    + '<div class="grade" style="margin-bottom:10px">'
    + inp('recDia','Dia do vencimento', dia, '', 'number', 'min="1" max="31" onchange="gerarRec()"')
    + inp('recMeses','Repetir por (meses)', 12, '', 'number', 'min="1" max="36" onchange="gerarRec()"')
    + inp('recInicio','A partir de', String(val('cpVenc')||hoje()).slice(0,7)+'-01', '', 'month', 'onchange="gerarRec()"')
    + '<div class="campo"><label>&nbsp;</label><button class="btn sec" onclick="gerarRec()">Gerar meses</button></div>'
    + '</div><div id="tabRec"></div>';
  gerarRec();
}
function gerarRec(){
  const dia = Math.min(31, Math.max(1, parseInt(val('recDia')) || 1));
  const meses = Math.min(36, Math.max(1, parseInt(val('recMeses')) || 12));
  const ini = (val('recInicio') || String(hoje()).slice(0,7)) + '-01';
  const base = n(val('cpValor'));
  const d0 = new Date(ini + 'T12:00');
  const novas = [];
  for (let i=0;i<meses;i++){
    const d = new Date(d0.getFullYear(), d0.getMonth() + i, 1, 12);
    const ultimo = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(dia, ultimo));
    const ant = REC_TMP[i];
    novas.push({ venc: d.toISOString().slice(0,10), valor: ant ? ant.valor : (base || '') });
  }
  REC_TMP = novas; pintarRec();
}
function pintarRec(){
  const box = document.getElementById('tabRec'); if (!box) return;
  const soma = REC_TMP.reduce((s,r) => s + n(r.valor), 0);
  const sem = REC_TMP.filter(r => !n(r.valor)).length;
  box.innerHTML = '<div class="tw" style="max-height:260px;overflow:auto"><table><thead><tr><th>#</th><th>Vencimento</th><th class="num">Valor (R$)</th><th></th></tr></thead><tbody>'
    + REC_TMP.map((r,i) =>
      '<tr><td>'+(i+1)+'</td>'
      + '<td><input type="date" value="'+esc(r.venc)+'" onchange="REC_TMP['+i+'].venc=this.value" style="padding:4px 6px;border:1px solid var(--line);border-radius:4px"></td>'
      + '<td class="num"><input value="'+(n(r.valor)?nMoeda(r.valor):'')+'" placeholder="em branco" oninput="REC_TMP['+i+'].valor=this.value" onblur="pintarRec()" style="width:110px;text-align:right;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-family:\'IBM Plex Mono\',monospace"></td>'
      + '<td>'+(n(r.valor) ? '' : '<span class="tag t-pend">boleto não recebido</span>')+'</td></tr>').join('')
    + '</tbody><tfoot><tr><th colspan="2" style="text-align:right">Total informado</th><th class="num">'+nMoeda(soma)+'</th><th class="mini">'+sem+' sem valor</th></tr></tfoot></table></div>'
    + '<p class="mini" style="margin-top:6px">Deixe o valor em branco nos meses em que o boleto ainda não chegou. Essas contas ficam marcadas como "boleto não recebido" e podem ser preenchidas depois.</p>';
}

  if (!val('cpDesc')) return toast('Informe a descrição.','erro');
  if (!recorrente && !n(val('cpValor'))) return toast('Informe o valor.','erro');

    toast('Conta salva na nuvem.','ok');
  }catch(e){}
}

  const mes = FILTROS.fMesC || '', t = FILTROS.busca;
  const coms = (DB.COMISSIONADOS||[]).filter(c => c.ATIVO !== 'NAO');

  // uma linha por recebimento conciliado
  let recs = (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida').map(p => {
    const l = lancDe(p.LANC_ID);
    return {p, l, data:p.DATA_CREDITO, cliente:l.CLIENTE||'—', pasta:l.PASTA||'—',
            sub:(l.SUBCLASSE||'—') + (l.EXEZ === 'SIM' ? ' · EXEZ' : ''),
            caiu:n(p.VALOR_CREDITADO||p.VALOR), esc:n(p.VALOR_ESCRITORIO),
            base:rd(n(p.VALOR_ESCRITORIO) - n(p.TARIFA)),
            itens:(DB.COMISSOES||[]).filter(c => c.PARCELA_ID === p.ID)};
  }).filter(r => !mes || mesDe(r.data) === mes)
    .filter(r => casa(r, ['cliente','pasta','sub'], t))
    .sort((a,b) => String(b.data).localeCompare(String(a.data)));

  const porCom = {};
  todas.forEach(c => { porCom[c.COMISSIONADO_ID] = porCom[c.COMISSIONADO_ID] || {t:0, ab:0};

    if (c.STATUS !== 'Paga') porCom[c.COMISSIONADO_ID].ab += n(c.VALOR); });

  const cabecalho = '<tr><th>Crédito</th><th>Pasta / cliente</th><th>Categoria</th>'
    + '<th class="num">Caiu na conta</th><th class="num">Para o escritório</th><th class="num">Base padrão</th>'

    + '<td class="num">'+nMoeda(r.base)+'</td>'
    + coms.map(c => { const it = r.itens.find(x => x.COMISSIONADO_ID === c.ID);
        return '<td class="num">' + (it ? nMoeda(it.VALOR) + '<div class="mini">' + nMoeda(it.PCT) + '% de ' + moeda(it.BASE)
          + (it.STATUS === 'Paga' ? ' · paga' : '') + '</div>' : '<span class="mini">—</span>') + '</td>'; }).join('')
    + '</tr>').join('')
    : '<tr><td colspan="'+(6+coms.length)+'">'+vazio('Sem comissões no período','As comissões são geradas na conciliação, conforme as regras por categoria.')+'</td></tr>';

  const rodape = recs.length ? '<tfoot><tr><th colspan="3" style="text-align:right">Totais</th>'
    + '<th class="num">'+nMoeda(recs.reduce((s,r)=>s+r.caiu,0))+'</th>'
    + '<th class="num">'+nMoeda(recs.reduce((s,r)=>s+r.esc,0))+'</th>'
    + '<th class="num">'+nMoeda(recs.reduce((s,r)=>s+r.base,0))+'</th>'

    + '</div>'

      : '<div class="card">'+vazio('Nenhum comissionado cadastrado','Cadastre os comissionados e as regras por categoria na engrenagem, em Regras de comissão.')+'</div>');

/* ══════════════════ PAINEL E DRE ══════════════════ */
function telaPainel(){
  const mes = FILTROS.fMesD || mesDe(hoje());
  const noMes = d => !mes || mesDe(d) === mes;

  const recb = (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida' && noMes(p.DATA_CREDITO));
  const tarifas = recb.reduce((s,p) => s + n(p.TARIFA), 0);
  const hon = recb.filter(p => p.TIPO !== 'Sucumbência').reduce((s,p) => s + n(p.VALOR_ESCRITORIO) - n(p.TARIFA), 0);
  const suc = recb.filter(p => p.TIPO === 'Sucumbência').reduce((s,p) => s + n(p.VALOR_ESCRITORIO), 0);
  // em recebimentos divididos, só a parte do escritório é receita; a do cliente é repasse
  const crRecebidas = (DB.CONTAS_RECEBER||[]).filter(c => c.STATUS === 'Recebido' && noMes(c.DATA_RECEB));
  const outras = crRecebidas.reduce((s,c) => s + (n(c.VALOR_ESCRITORIO) || n(c.VALOR)), 0);
  const repasseAvulso = crRecebidas.reduce((s,c) => s + n(c.VALOR_CLIENTE), 0);
  const repasses = recb.reduce((s,p) => s + n(p.VALOR_CLIENTE), 0) + repasseAvulso;
  const bruta = hon + suc + tarifas + outras;

  const desp = {};
  (DB.CONTAS_PAGAR||[]).filter(c => c.CATEGORIA !== 'Repasse a cliente' && noMes(c.VENCIMENTO))
    .forEach(c => { desp[c.CATEGORIA || 'Outras despesas'] = (desp[c.CATEGORIA||'Outras despesas'] || 0) + n(c.VALOR); });
  const totDesp = Object.values(desp).reduce((s,v) => s + v, 0);
  const resultado = bruta - totDesp;

  const aberto = pendentesReceber();
  const escAberto = aberto.reduce((s,p) => { const l = lancDe(p.LANC_ID);
    return s + rd(n(p.VALOR)*n(l.PCT_ESCRITORIO)/100 + tarifaDe(p,l)); }, 0);
  const cpAberto = (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS !== 'Pago').reduce((s,c) => s + n(c.VALOR), 0);
  const pendConc = (DB.EXTRATO||[]).filter(m => m.STATUS !== 'Conciliado').length;

  const li = (rot, v, cls) => '<tr class="'+(cls||'')+'"><td>'+esc(rot)+'</td><td class="num'+(n(v)<0?' neg':'')+'">'+nMoeda(v)+'</td></tr>';

  return cabec('Painel e DRE', 'Resultado por regime de caixa. Repasses aos clientes são recursos de terceiros e ficam fora do resultado.',
      '<button class="btn sec" onclick="exportarCSV(\'dre\')">Exportar CSV</button>')
    + '<div class="filtros">' + selMes('fMesD', mes) + '</div>'
    + '<div class="kpis">'
    + kpi('Receita do escritório', moeda(bruta), mes ? mesBR(mes) : 'todo o período', 'p')
    + kpi('Despesas', moeda(totDesp), 'sem repasses a clientes', 'n')
    + kpi('Resultado', moeda(resultado), resultado >= 0 ? 'superávit' : 'déficit', resultado >= 0 ? 'p' : 'n')
    + kpi('A conciliar', pendConc, 'movimentos do banco em aberto', pendConc ? 'b' : '')
    + '</div>'
    + '<div class="kpis">'
    + kpi('A receber (escritório)', moeda(escAberto), aberto.length + ' parcela(s) em aberto', 'd')
    + kpi('A pagar', moeda(cpAberto), 'contas em aberto', 'b')
    + kpi('Repasses do mês', moeda(repasses), 'devidos aos clientes', '')
    + kpi('Tarifas do mês', moeda(tarifas), 'do cliente para o escritório', '')
    + '</div>'
    + '<div class="card"><h3>Demonstração do resultado — '+(mes ? mesBR(mes) : 'todo o período')+'</h3><div class="tw">'
    + '<table class="dre"><tbody>'
    + li('Receita bruta', bruta, 'nivel1')
    + li('Honorários contratuais (parte do escritório)', hon, 'recuo')
    + li('Honorários de sucumbência', suc, 'recuo')
    + li('Tarifas bancárias repassadas ao escritório', tarifas, 'recuo')
    + li('Outras receitas', outras, 'recuo')
    + li('Despesas operacionais', -totDesp, 'nivel1')
    + Object.keys(desp).sort().map(k => li(k, -desp[k], 'recuo')).join('')
    + li('Resultado do período', resultado, 'total')
    + '</tbody></table></div>'
    + '<div class="corpo" style="border-top:1px solid var(--line2)">'
    + '<h3 style="border:0;padding:0 0 8px;font-size:12px;color:var(--ink2)">Contas de terceiros (fora do resultado)</h3>'
    + '<table class="dre"><tbody>' + li('Repasses devidos aos clientes no período', repasses)
    + '</tbody></table></div></div>'
    + graficoMeses();
}
function graficoMeses(){
  const meses = {};
  (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida' && p.DATA_CREDITO).forEach(p => {
    const m = mesDe(p.DATA_CREDITO); meses[m] = (meses[m] || 0) + n(p.VALOR_ESCRITORIO);
  });
  const ks = Object.keys(meses).sort().slice(-12);
  if (!ks.length) return '';
  const max = Math.max(...ks.map(k => meses[k]));
  return '<div class="card"><h3>Receita do escritório por mês</h3><div class="corpo">'
    + ks.map(k => '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px">'
      + '<span>'+mesBR(k)+'</span><span class="num">'+moeda(meses[k])+'</span></div>'
      + '<div class="barra"><i style="width:'+Math.round(meses[k]/max*100)+'%"></i></div></div>').join('')
    + '</div></div>';
}

/* ══════════════════ EXPORTAÇÃO ══════════════════ */
function exportarCSV(qual){
  let cab = [], linhas = [];
  if (qual === 'contas-a-receber'){
    cab = ['Vencimento','Pasta','Cliente','Processo','Descrição','Valor','Cliente R$','Escritório R$'];
    pendentesReceber().sort((a,b)=>String(a.VENCIMENTO).localeCompare(String(b.VENCIMENTO))).forEach(p => {
      const l = lancDe(p.LANC_ID);
      const tf = tarifaDe(p, l);
      linhas.push([dataBR(p.VENCIMENTO), l.PASTA, l.CLIENTE, l.N_PROCESSO, p.TIPO+(p.NUM>0?' '+p.NUM:''),
        nMoeda(p.VALOR), nMoeda(n(p.VALOR)*n(l.PCT_CLIENTE)/100 - tf), nMoeda(n(p.VALOR)*n(l.PCT_ESCRITORIO)/100 + tf)]);
    });
  } else if (qual === 'contas-recebidas'){
    cab = ['Crédito','Pasta','Cliente','Descrição','Valor','Cliente','Tarifa','Escritório'];
    (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida').forEach(p => {
      const l = lancDe(p.LANC_ID);
      linhas.push([dataBR(p.DATA_CREDITO), l.PASTA, l.CLIENTE, p.TIPO+(p.NUM>0?' '+p.NUM:''),
        nMoeda(p.VALOR_CREDITADO||p.VALOR), nMoeda(p.VALOR_CLIENTE), nMoeda(p.TARIFA), nMoeda(p.VALOR_ESCRITORIO)]);
    });
  } else if (qual === 'contas-a-pagar'){
    cab = ['Recebido do cliente','Vencimento','Descrição','Favorecido','Categoria','Valor'];
    (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS !== 'Pago').forEach(c => { const lb = liberacao(c);
      linhas.push([lb.tipo === 'na' ? '' : (lb.tipo === 'ok' ? 'SIM' : 'NAO'), dataBR(c.VENCIMENTO), c.DESCRICAO,
        c.FAVORECIDO, c.CATEGORIA, semValorCP(c) ? 'boleto nao recebido' : nMoeda(c.VALOR)]); });
  } else if (qual === 'contas-pagas'){
    cab = ['Pagamento','Vencimento','Descrição','Favorecido','Categoria','Valor','Origem'];
    (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS === 'Pago')
      .sort((a,b) => String(b.DATA_PGTO).localeCompare(String(a.DATA_PGTO)))
      .forEach(c => linhas.push([dataBR(c.DATA_PGTO), dataBR(c.VENCIMENTO), c.DESCRICAO,
        c.FAVORECIDO, c.CATEGORIA, nMoeda(c.VALOR), c.ORIGEM]));
  } else if (qual === 'conta-corrente'){
    cab = ['Data','Histórico','Baixou','Conta','Entrada','Saída','Saldo acumulado'];
    const L = linhasCorrente();
    let acum = 0;
    L.forEach(r => { acum = rd(acum + n(r.m.VALOR)); r.saldo = acum; });
    L.slice().reverse().forEach(r => {
      const v = n(r.m.VALOR), d = ehDebito(r.m);
      linhas.push([dataBR(r.m.DATA), r.m.IDENTIFICACAO, r.nome, r.m.BANCO,
        d ? '' : nMoeda(v), d ? nMoeda(Math.abs(v)) : '', nMoeda(r.saldo)]);
    });
  } else {
    cab = ['Mês','Receita escritório','Repasses a clientes','Tarifas'];
    const M = {};
    (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida').forEach(p => {
      const m = mesDe(p.DATA_CREDITO); M[m] = M[m] || [0,0,0];
      M[m][0] += n(p.VALOR_ESCRITORIO); M[m][1] += n(p.VALOR_CLIENTE); M[m][2] += n(p.TARIFA);
    });
    Object.keys(M).sort().forEach(m => linhas.push([mesBR(m), nMoeda(M[m][0]), nMoeda(M[m][1]), nMoeda(M[m][2])]));
  }
  const csv = [cab].concat(linhas).map(l => l.map(c => '"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = qual + '-' + hoje() + '.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('Arquivo gerado.','ok');
}

/* ══════════════════ CONTA CORRENTE ══════════════════
   Todos os movimentos já conciliados, em formato de extrato:
   a data mais recente primeiro, a mais antiga por último.
   ═══════════════════════════════════════════════════════ */
function linhasCorrente(){
  const conta = FILTROS.ccConta || '', de = FILTROS.ccDe || '', ate = FILTROS.ccAte || '';
  const vmin = FILTROS.ccMin, vmax = FILTROS.ccMax, tipo = FILTROS.ccTipo || '';
  const t = (FILTROS.busca||'').toLowerCase();
  return (DB.EXTRATO||[])
    .filter(m => m.STATUS === 'Conciliado')
    .filter(m => !conta || m.BANCO === conta)
    .filter(m => !de || String(m.DATA) >= de)
    .filter(m => !ate || String(m.DATA) <= ate)
    .filter(m => !tipo || (tipo === 'D' ? ehDebito(m) : !ehDebito(m)))
    .filter(m => { const v = Math.abs(n(m.VALOR));
      return (!vmin || v >= n(vmin)) && (!vmax || v <= n(vmax)); })
    .map(m => { const a = alvoDe(m);
      const nome = a.tipo === 'parcela' ? [a.l.CLIENTE, a.l.PASTA].filter(Boolean).join(' ')
                 : a.tipo === 'pagar' ? [a.cp.FAVORECIDO, a.cp.DESCRICAO].filter(Boolean).join(' ')
                 : a.tipo === 'receber' ? [a.cr.CLIENTE, a.cr.DESCRICAO].filter(Boolean).join(' ') : '';
      return {m, a, nome}; })
    .filter(r => !t || (String(r.m.IDENTIFICACAO||'') + ' ' + r.nome).toLowerCase().includes(t))
    .sort((a,b) => String(a.m.DATA).localeCompare(String(b.m.DATA)) || String(a.m.ID).localeCompare(String(b.m.ID)));
}
function telaContaCorrente(){
  const L = linhasCorrente();                       // ordem antiga → recente, para o saldo acumulado
  let acum = 0;
  L.forEach(r => { acum = rd(acum + n(r.m.VALOR)); r.saldo = acum; });
  const vis = L.slice().reverse();                  // exibição: mais recente primeiro

  const cred = L.filter(r => !ehDebito(r.m)).reduce((s,r) => s + n(r.m.VALOR), 0);
  const deb = L.filter(r => ehDebito(r.m)).reduce((s,r) => s + n(r.m.VALOR), 0);

  return cabec('Conta corrente', 'Extrato dos movimentos já conciliados, do mais recente para o mais antigo.',
      '<button class="btn sec" onclick="limparFiltrosCC()">Limpar filtros</button>'
    + '<button class="btn sec" onclick="exportarCSV(\'conta-corrente\')">Exportar CSV</button>')
    + '<div class="kpis">'
    + kpi('Entradas', moeda(cred), L.filter(r => !ehDebito(r.m)).length + ' crédito(s)', 'p')
    + kpi('Saídas', moeda(deb), L.filter(r => ehDebito(r.m)).length + ' débito(s)', 'n')
    + kpi('Resultado do período', moeda(rd(cred + deb)), 'entradas menos saídas', rd(cred+deb) >= 0 ? 'p' : 'n')
    + kpi('Movimentos', L.length, 'no filtro atual', 'd')
    + '</div>'
    + '<div class="filtros">'
    + campoBusca('Nome, favorecido, histórico…')
    + sel('ccConta','Conta bancária', opcoesContas(true), FILTROS.ccConta||'', '', 'onchange="setF(\'ccConta\',this.value)"')
    + '<div class="campo"><label for="ccDe">De</label><input type="date" id="ccDe" value="'+esc(FILTROS.ccDe||'')+'" onchange="setF(\'ccDe\',this.value)"></div>'
    + '<div class="campo"><label for="ccAte">Até</label><input type="date" id="ccAte" value="'+esc(FILTROS.ccAte||'')+'" onchange="setF(\'ccAte\',this.value)"></div>'
    + '<div class="campo"><label for="ccMin">Valor de</label><input id="ccMin" value="'+esc(FILTROS.ccMin||'')+'" placeholder="0,00" onchange="setF(\'ccMin\',this.value)"></div>'
    + '<div class="campo"><label for="ccMax">Valor até</label><input id="ccMax" value="'+esc(FILTROS.ccMax||'')+'" placeholder="0,00" onchange="setF(\'ccMax\',this.value)"></div>'
    + sel('ccTipo','Tipo', [['','Tudo'],['C','Entradas'],['D','Saídas']], FILTROS.ccTipo||'', '', 'onchange="setF(\'ccTipo\',this.value)"')
    + '</div>'
    + '<div class="card"><div class="tw"><table class="densa"><thead><tr><th>Data</th><th>Histórico</th><th>Baixou</th>'
    + '<th>Conta</th><th class="num">Entrada</th><th class="num">Saída</th><th class="num">Saldo acumulado</th><th></th></tr></thead><tbody>'
    + (vis.length ? vis.map(r => {
        const v = n(r.m.VALOR), d = ehDebito(r.m);
        return '<tr><td>'+dataBR(r.m.DATA)+'</td>'
          + '<td>'+esc(r.m.IDENTIFICACAO||'—')+'</td>'
          + '<td>'+r.a.quem+'</td>'
          + '<td class="mini">'+esc(r.m.BANCO||'—')+'</td>'
          + '<td class="num pos">'+(d ? '—' : nMoeda(v))+'</td>'
          + '<td class="num neg">'+(d ? nMoeda(Math.abs(v)) : '—')+'</td>'
          + '<td class="num'+(r.saldo < 0 ? ' neg' : '')+'">'+nMoeda(r.saldo)+'</td>'
          + '<td style="text-align:right"><button class="btn sm sec" onclick="desfazer(\''+r.m.ID+'\')">Desfazer</button></td></tr>';
      }).join('')
      : '<tr><td colspan="8">'+vazio('Nenhum movimento conciliado','Concilie os créditos e débitos do extrato para vê-los aqui.')+'</td></tr>')
    + '</tbody></table></div></div>'
    + '<p class="mini">O saldo acumulado soma apenas os movimentos conciliados dentro do filtro — não é o saldo da conta no banco.</p>';
}
function limparFiltrosCC(){
  ['ccConta','ccDe','ccAte','ccMin','ccMax','ccTipo','busca'].forEach(k => delete FILTROS[k]);
  render();
}

/* ══════════════════ CONTAS PAGAS ══════════════════ */
function telaPagas(){
  const t = FILTROS.busca, mes = FILTROS.fMesPg || '', cat = FILTROS.fCatPg || '';
  const L = (DB.CONTAS_PAGAR||[])
    .filter(c => c.STATUS === 'Pago')
    .filter(c => casa(c, ['DESCRICAO','FAVORECIDO','CATEGORIA','OBS'], t))
    .filter(c => !mes || mesDe(c.DATA_PGTO) === mes)
    .filter(c => !cat || c.CATEGORIA === cat)
    .sort((a,b) => String(b.DATA_PGTO).localeCompare(String(a.DATA_PGTO)));

  const cats = [...new Set((DB.CONTAS_PAGAR||[]).filter(c => c.STATUS === 'Pago').map(c => c.CATEGORIA).filter(Boolean))].sort();
  const total = L.reduce((s,c) => s + n(c.VALOR), 0);
  const repasses = L.filter(c => c.CATEGORIA === 'Repasse a cliente').reduce((s,c) => s + n(c.VALOR), 0);
  const comissoes = L.filter(c => c.CATEGORIA === 'Comissão').reduce((s,c) => s + n(c.VALOR), 0);

  return cabec('Contas pagas', 'Contas baixadas pela conciliação do extrato. Saem automaticamente de contas a pagar.',
      '<button class="btn sec" onclick="exportarCSV(\'contas-pagas\')">Exportar CSV</button>')
    + '<div class="kpis">'
    + kpi('Total pago', moeda(total), L.length + ' conta(s)', 'p')
    + kpi('Repasses a clientes', moeda(repasses), 'recursos de terceiros', 'b')
    + kpi('Comissões', moeda(comissoes), 'pagas aos comissionados', 'd')
    + kpi('Despesas do escritório', moeda(rd(total - repasses - comissoes)), 'demais categorias', 'n')
    + '</div>'
    + '<div class="filtros">' + campoBusca('Descrição, favorecido…')
    + selMesPg(mes)
    + sel('fCatPg','Categoria', [['','Todas']].concat(cats.map(c => [c,c])), cat, '', 'onchange="setF(\'fCatPg\',this.value)"')
    + '</div>'
    + '<div class="card"><div class="tw"><table><thead><tr><th>Pagamento</th><th>Vencimento</th><th>Descrição</th>'
    + '<th>Favorecido</th><th>Categoria</th><th class="num">Valor</th><th></th></tr></thead><tbody>'
    + (L.length ? L.map(c => '<tr><td><b>'+dataBR(c.DATA_PGTO)+'</b></td><td class="mini">'+dataBR(c.VENCIMENTO)+'</td>'
      + '<td'+(c.OBS?' title="'+esc(c.OBS)+'"':'')+'>'+esc(c.DESCRICAO)
      + (c.ORIGEM && c.ORIGEM !== 'Manual' ? '<div class="mini">'+esc(c.ORIGEM)+'</div>' : '') + '</td>'
      + '<td>'+esc(c.FAVORECIDO||'—')+'</td><td>'+esc(c.CATEGORIA||'—')+'</td>'
      + '<td class="num">'+nMoeda(c.VALOR)+'</td>'
      + '<td style="text-align:right">'+botaoDesfazerPago(c)+'</td></tr>').join('')
      : '<tr><td colspan="7">'+vazio('Nenhuma conta paga','As contas aparecem aqui quando o débito correspondente é conciliado no extrato.')+'</td></tr>')
    + '</tbody></table></div></div>';
}
function selMesPg(valor){
  const meses = new Set();
  (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS === 'Pago' && c.DATA_PGTO).forEach(c => meses.add(mesDe(c.DATA_PGTO)));
  return '<div class="campo"><label>Mês do pagamento</label><select onchange="setF(\'fMesPg\',this.value)"><option value="">Todos</option>'
    + [...meses].sort().reverse().map(m => '<option value="'+m+'"'+(valor===m?' selected':'')+'>'+mesBR(m)+'</option>').join('')
    + '</select></div>';
}
function botaoDesfazerPago(c){
  const m = (DB.EXTRATO||[]).find(x => x.PARCELA_ID === c.ID && x.STATUS === 'Conciliado');
  return m ? '<button class="btn sm sec" onclick="desfazer(\''+m.ID+'\')">Desfazer baixa</button>'
           : '<span class="mini">—</span>';
}
