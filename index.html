<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financeiro — Escritório de Advocacia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#eef1f0; --surface:#fff; --surface2:#f7f9f8;
  --ink:#16201f; --ink2:#5a6a67; --ink3:#8b9895;
  --line:#d4dcd9; --line2:#e6ecea;
  --brand:#0b5d5a; --brand-d:#073f3d; --brand-l:#e2efee;
  --brass:#9a7b2f; --brass-l:#f6efdf;
  --pos:#1f7a5c; --pos-l:#e3f2ec;
  --neg:#a0392e; --neg-l:#fae9e6;
  --r:6px; --rail:224px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num,td.num,th.num,.money{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ── LOGIN ── */
#login{position:fixed;inset:0;background:var(--brand-d);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
#login .cx{background:#fff;border-radius:10px;padding:38px 34px;width:100%;max-width:370px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
#login h1{font-size:19px;letter-spacing:-.2px;margin-bottom:4px}
#login p{color:var(--ink2);font-size:13px;margin-bottom:22px}
.campo{margin-bottom:13px}
.campo label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.campo input,.campo select,.campo textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-l)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:var(--r);padding:9px 16px;font-weight:600;font-size:13px}
.btn:hover{background:var(--brand-d)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--surface2)}
.btn.per{background:var(--neg)}
.btn.ok{background:var(--pos)}
.btn.full{width:100%;padding:11px}
.btn.sm{padding:5px 10px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.erro{background:var(--neg-l);color:var(--neg);padding:8px 11px;border-radius:var(--r);font-size:13px;margin-bottom:12px}

/* ── ESTRUTURA ── */
#app{display:none;min-height:100vh}
header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--brand-d);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:60}
header .marca{font-weight:600;letter-spacing:-.2px;font-size:15px}
header .marca small{display:block;font-size:11px;opacity:.62;font-weight:400;letter-spacing:.02em}
header .dir{margin-left:auto;display:flex;align-items:center;gap:10px}
header .quem{font-size:12px;opacity:.8;text-align:right}
.icobtn{width:34px;height:34px;border-radius:var(--r);border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;display:grid;place-items:center;font-size:16px}
.icobtn:hover{background:rgba(255,255,255,.13)}

nav{position:fixed;top:56px;bottom:0;left:0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);padding:12px 0;overflow-y:auto;z-index:50}
nav .grupo{font-size:10.5px;letter-spacing:.09em;color:var(--ink3);padding:14px 18px 6px;font-weight:600;text-transform:uppercase}
nav button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 18px;background:none;border:0;border-left:3px solid transparent;text-align:left;font-size:13.5px;color:var(--ink2)}
nav button:hover{background:var(--surface2);color:var(--ink)}
nav button.on{background:var(--brand-l);border-left-color:var(--brand);color:var(--brand-d);font-weight:600}
nav button .bolha{margin-left:auto;background:var(--brass);color:#fff;border-radius:9px;font-size:10.5px;padding:1px 6px;font-weight:600;font-family:'IBM Plex Mono',monospace}

main{margin:56px 0 0 var(--rail);padding:22px 24px 60px}
.titulo{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.titulo h2{font-size:21px;letter-spacing:-.3px}
.titulo p{color:var(--ink2);font-size:13px;margin-top:2px}
.titulo .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.card>h3{font-size:13px;font-weight:600;padding:11px 15px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.card>h3 .acoes{margin-left:auto;display:flex;gap:7px}
.card .corpo{padding:15px}

.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtabs button{background:none;border:0;padding:9px 14px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--brand-d);border-bottom-color:var(--brand);font-weight:600}

/* ── TABELAS ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:hover{background:var(--surface2)}
tr.grifo{background:var(--brass-l)}
.vazio{padding:34px 16px;text-align:center;color:var(--ink3);font-size:13px}
.vazio strong{display:block;color:var(--ink2);font-size:14px;margin-bottom:3px}

.tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.t-pend{background:var(--brass-l);color:var(--brass)}
.t-ok{background:var(--pos-l);color:var(--pos)}
.t-ni{background:var(--neg-l);color:var(--neg)}
.t-neutro{background:var(--line2);color:var(--ink2)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.selo{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;cursor:help}
.selo.ok{background:var(--pos-l);color:var(--pos);border:1px solid var(--pos)}
.selo.nao{background:var(--neg-l);color:var(--neg);border:1px solid var(--neg)}
.mini{font-size:11.5px;color:var(--ink3)}

/* ── FILTROS ── */
.filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filtros .campo{margin:0;min-width:130px}
.filtros .campo.busca{flex:1;min-width:200px}

/* ── KPIs ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 15px}
.kpi .rot{font-size:11.5px;color:var(--ink2);margin-bottom:5px}
.kpi .val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;letter-spacing:-.5px}
.kpi .sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.kpi.d{border-left:3px solid var(--brand)}
.kpi.p{border-left:3px solid var(--pos)}
.kpi.n{border-left:3px solid var(--neg)}
.kpi.b{border-left:3px solid var(--brass)}

/* ── MODAIS ── */
.overlay{position:fixed;inset:0;background:rgba(11,32,30,.5);display:none;align-items:flex-start;justify-content:center;z-index:150;padding:26px 16px;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:9px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.modal.larga{max-width:1000px}
.modal.estreita{max-width:440px}
.modal h3{font-size:16px;padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center}
.modal h3 .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--ink3)}
.modal .corpo{padding:20px;max-height:70vh;overflow-y:auto}
.modal .rodape{padding:13px 20px;border-top:1px solid var(--line2);display:flex;gap:9px;justify-content:flex-end;background:var(--surface2);border-radius:0 0 9px 9px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.grade .full{grid-column:1/-1}
.secao-form{font-size:11px;letter-spacing:.07em;color:var(--ink3);font-weight:600;grid-column:1/-1;padding-top:6px;border-top:1px solid var(--line2);margin-top:4px;text-transform:uppercase}
.check{display:flex;align-items:center;gap:8px;font-size:13px;padding-top:20px}
.check input{width:16px;height:16px;accent-color:var(--brand)}

/* ── SUGESTÕES DE CONCILIAÇÃO ── */
.sug{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-bottom:7px;display:flex;gap:11px;align-items:center;background:#fff}
.sug:last-child{margin-bottom:0}
.sug .info{flex:1;min-width:0}
.sug .info b{font-size:13px}
.sug .porq{font-size:11.5px;color:var(--ink2);margin-top:2px}
.score{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--brand-l);color:var(--brand-d)}
.score.alto{background:var(--pos-l);color:var(--pos)}
.score.baixo{background:var(--line2);color:var(--ink2)}

/* ── DRE ── */
table.dre td:first-child{white-space:nowrap}
table.dre tr.nivel1 td{font-weight:600;background:var(--surface2)}
table.dre tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);font-size:14px}
table.dre tr.recuo td:first-child{padding-left:26px;color:var(--ink2)}
.barra{height:7px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:5px}
.barra i{display:block;height:100%;background:var(--brand)}

/* ── AVISO / TOAST ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:7px;font-size:13px;z-index:300;transition:transform .22s;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.erro{background:var(--neg)} #toast.ok{background:var(--pos)}
#carregando{position:fixed;inset:0;background:rgba(238,241,240,.85);display:none;place-items:center;z-index:250;font-size:13px;color:var(--ink2)}
#carregando.on{display:grid}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:g .8s linear infinite;margin:0 auto 10px}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:900px){
  :root{--rail:0px}
  nav{position:static;width:auto;height:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0;margin-top:56px}
  nav .grupo{display:none}
  nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:11px 14px}
  nav button.on{border-left:0;border-bottom-color:var(--brand)}
  main{margin:0;padding:16px 13px 50px}
  header .quem{display:none}
}
</style>
</head>
<body>

<div id="login">
  <div class="cx">
    <h1>Financeiro</h1>
    <p id="loginSub">Escritório de advocacia</p>
    <div id="loginErro"></div>
    <div class="campo"><label for="lgUser">Usuário</label><input id="lgUser" autocomplete="username"></div>
    <div class="campo"><label for="lgSenha">Senha</label><input id="lgSenha" type="password" autocomplete="current-password"></div>
    <button class="btn full" onclick="entrar()">Entrar</button>
    <p class="mini" style="margin-top:14px">Primeiro acesso: <b>admin</b> / <b>admin</b> — troque a senha na engrenagem.</p>
  </div>
</div>

<div id="app">
  <header>
    <div class="marca">Financeiro<small id="hdEscritorio">Escritório de advocacia</small></div>
    <div class="dir">
      <div class="quem"><b id="hdUser"></b><br><span id="hdPerfil"></span></div>
      <button class="icobtn" title="Atualizar dados" onclick="carregar(true)">↻</button>
      <button class="icobtn" title="Configurações" onclick="abrirConfig()">⚙</button>
      <button class="icobtn" title="Sair" onclick="sair()">⏻</button>
    </div>
  </header>

  <nav id="nav"></nav>
  <main id="tela"></main>
</div>

<div class="overlay" id="ov"><div class="modal" id="mod"></div></div>
<div id="toast"></div>
<div id="carregando"><div style="text-align:center"><div class="spin"></div><span id="msgCarregando">Carregando…</span></div></div>

<script>
/* ══════════════════════════════════════════════════════════
   CONFIGURAÇÃO — cole aqui a URL /exec do seu Apps Script
   ══════════════════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzNNoolgJTQ5fKDmQ9ieSdWoLQrdKpRZB_GrxGHqtFjAFagZYoZ5a7_cCzfuDnvk05h/exec';

/* ── ESTADO ── */
let DB = {}, USER = null, ABA = 'conciliacao', SUB = '', FILTROS = {};
const A = { CONFIG:'CONFIG', USUARIOS:'USUARIOS', FILIAIS:'FILIAIS', SUBCLASSES:'SUBCLASSES',
  COMISSIONADOS:'COMISSIONADOS', REGRAS:'REGRAS_COMISSAO', LANC:'LANCAMENTOS', PARC:'PARCELAS',
  EXT:'EXTRATO', CP:'CONTAS_PAGAR', CR:'CONTAS_RECEBER', COM:'COMISSOES' };

/* ── UTILITÁRIOS ── */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => (p||'r') + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function n(v){
  if (typeof v === 'number') return v;
  if (v == null || v === '') return 0;
  let s = String(v).replace(/[^\d,.\-]/g,'').trim();
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const x = parseFloat(s);
  return isNaN(x) ? 0 : x;
}
const rd = v => Math.round(n(v)*100)/100;
function moeda(v){
  const x = rd(v);
  return (x<0?'-':'') + 'R$ ' + Math.abs(x).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function nMoeda(v){ return rd(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function hoje(){ return new Date().toISOString().slice(0,10); }
function dataBR(iso){
  if (!iso) return '—';
  const s = String(iso).slice(0,10), p = s.split('-');
  return p.length === 3 ? p[2]+'/'+p[1]+'/'+p[0] : s;
}
function isoDe(txt){
  if (!txt) return '';
  const s = String(txt).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1]+'-'+m[2]+'-'+m[3];
  m = s.match(/(\d{2})[\/.-](\d{2})[\/.-](\d{4})/); if (m) return m[3]+'-'+m[2]+'-'+m[1];
  m = s.match(/(\d{2})[\/.-](\d{2})[\/.-](\d{2})$/); if (m) return '20'+m[3]+'-'+m[2]+'-'+m[1];
  m = s.match(/^(\d{4})(\d{2})(\d{2})/); if (m) return m[1]+'-'+m[2]+'-'+m[3];
  return '';
}
function diasEntre(a,b){
  if (!a || !b) return 999;
  return Math.abs((new Date(a+'T12:00') - new Date(b+'T12:00')) / 86400000);
}
const digitos = s => String(s||'').replace(/\D/g,'');
const mesDe = iso => String(iso||'').slice(0,7);
function mesBR(ym){
  if (!ym) return '—';
  const M = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const p = ym.split('-'); return M[+p[1]-1] + '/' + p[0];
}
function toast(msg, tipo){
  const t = $('#toast'); t.textContent = msg; t.className = 'on ' + (tipo||'');
  clearTimeout(t._t); t._t = setTimeout(()=>t.className='', 3400);
}
function carregandoOn(msg){ $('#msgCarregando').textContent = msg || 'Carregando…'; $('#carregando').classList.add('on'); }
function carregandoOff(){ $('#carregando').classList.remove('on'); }
const cfg = (k, pad) => { const r = (DB.CONFIG||[]).find(c => c.CHAVE === k); return r ? r.VALOR : (pad||''); };

/* ── API ── */
async function api(payload){
  if (!API_URL || API_URL.indexOf('COLE_AQUI') === 0) throw new Error('Configure a API_URL no index.html antes de usar.');
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Falha na comunicação com o servidor.');
  return j;
}
async function salvar(aba, reg, silencio){
  const j = await api({action:'salvar', aba, registro:reg});
  const lista = DB[aba] || (DB[aba] = []);
  const i = lista.findIndex(x => x.ID === j.registro.ID);
  if (i >= 0) lista[i] = j.registro; else lista.push(j.registro);
  if (!silencio) toast('Salvo.','ok');
  return j.registro;
}
async function salvarLote(lote){
  lote.forEach(it => { if (!it.registro.ID) it.registro.ID = uid(); });
  await api({action:'salvarLote', lote});
  lote.forEach(it => {
    const lista = DB[it.aba] || (DB[it.aba] = []);
    const i = lista.findIndex(x => x.ID === it.registro.ID);
    if (i >= 0) lista[i] = it.registro; else lista.push(it.registro);
  });
}
async function excluir(aba, id){
  await api({action:'excluir', aba, id});
  DB[aba] = (DB[aba]||[]).filter(x => x.ID !== id);
}
async function carregar(avisar){
  carregandoOn('Carregando dados…');
  try{
    const j = await api({action:'carregar'});
    DB = j.dados; DB._planilha = j.planilha; DB._pasta = j.pasta; DB._versao = j.versao;
    $('#hdEscritorio').textContent = cfg('NOME_ESCRITORIO','Escritório de advocacia');
    render();
    if (avisar) toast('Dados atualizados.','ok');
  }catch(e){ toast(e.message,'erro'); }
  finally{ carregandoOff(); }
}

/* ── LOGIN ── */
async function entrar(){
  const login = $('#lgUser').value.trim(), senha = $('#lgSenha').value;
  if (!login || !senha){ $('#loginErro').innerHTML = '<div class="erro">Informe usuário e senha.</div>'; return; }
  carregandoOn('Entrando…');
  try{
    const j = await api({action:'login', login, senha});
    USER = j.usuario;
    sessionStorage.setItem('fin_user', JSON.stringify(USER));
    $('#login').style.display = 'none'; $('#app').style.display = 'block';
    $('#hdUser').textContent = USER.NOME; $('#hdPerfil').textContent = USER.PERFIL;
    await carregar();
  }catch(e){ $('#loginErro').innerHTML = '<div class="erro">'+esc(e.message)+'</div>'; }
  finally{ carregandoOff(); }
}
function sair(){ sessionStorage.removeItem('fin_user'); location.reload(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && $('#login').style.display !== 'none') entrar();
  if (e.key === 'Escape') fecharModal();
});

/* ── MODAL ── */
function modal(titulo, corpo, rodape, classe){
  $('#mod').className = 'modal ' + (classe||'');
  $('#mod').innerHTML = '<h3>'+esc(titulo)+'<button class="x" onclick="fecharModal()" aria-label="Fechar">&times;</button></h3>'
    + '<div class="corpo">'+corpo+'</div>' + (rodape ? '<div class="rodape">'+rodape+'</div>' : '');
  $('#ov').classList.add('on');
}
function fecharModal(){ $('#ov').classList.remove('on'); }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') fecharModal(); });
const val = id => { const e = document.getElementById(id); return e ? (e.type === 'checkbox' ? e.checked : e.value.trim()) : ''; };

/* ── NAVEGAÇÃO ── */
const MODULOS = [
  {g:'Movimento'},
  {k:'conciliacao', t:'Conciliação bancária', i:'⇄'},
  {k:'lancamentos', t:'Lançamentos', i:'▤'},
  {g:'Contas'},
  {k:'receber', t:'Contas a receber', i:'↓'},
  {k:'recebidas', t:'Contas recebidas', i:'✓'},
  {k:'pagar', t:'Contas a pagar', i:'↑'},
  {k:'comissoes', t:'Comissões', i:'%'},
  {g:'Gestão'},
  {k:'painel', t:'Painel e DRE', i:'◧'}
];

async function gravarConta(id, antigo){
  const nome = val('cbNome');
  if (!nome) return toast('Informe o apelido da conta.','erro');
  if ((DB.CONTAS_BANCO||[]).some(c => c.ID !== id && c.NOME.toLowerCase() === nome.toLowerCase()))
    return toast('Já existe uma conta com esse apelido.','erro');
  const lote = [{aba:'CONTAS_BANCO', registro:{ID:id||'', NOME:nome, BANCO:val('cbBanco'),
    AGENCIA:val('cbAg'), CONTA:val('cbConta'), ATIVO:val('cbAtivo')}}];
  // renomear a conta arrasta os movimentos já importados
  if (id && antigo && antigo !== nome){
    (DB.EXTRATO||[]).filter(m => m.BANCO === antigo).forEach(m =>
      lote.push({aba:'EXTRATO', registro: Object.assign({}, m, {BANCO:nome})}));
  }
  carregandoOn('Salvando…');
  try{ await salvarLote(lote); abrirConfig('contas'); render(); toast('Conta salva.','ok'); }
  catch(e){ toast(e.message,'erro'); } finally{ carregandoOff(); }
}
async function excluirConta(id){
  const c = (DB.CONTAS_BANCO||[]).find(x => x.ID === id) || {};
  const movs = (DB.EXTRATO||[]).filter(m => m.BANCO === c.NOME).length;
  if (movs) return toast('Esta conta tem '+movs+' movimento(s) no extrato. Deixe-a inativa em vez de excluir.','erro');
  apagarReg('CONTAS_BANCO', id, c.NOME, 'contas');
}

/* helper de campo */
function inp(id, rot, v, cls, tipo, extra){
  return '<div class="campo '+(cls||'')+'"><label for="'+id+'">'+esc(rot)+'</label>'
    + '<input id="'+id+'" type="'+(tipo||'text')+'" value="'+esc(v==null?'':v)+'" '+(extra||'')+'></div>';

function sel(id, rot, opcoes, v, cls, extra){
  return '<div class="campo '+(cls||'')+'"><label for="'+id+'">'+esc(rot)+'</label><select id="'+id+'" '+(extra||'')+'>'
    + opcoes.map(o => { const [k,t] = Array.isArray(o) ? o : [o,o];
        return '<option value="'+esc(k)+'"'+(String(v)===String(k)?' selected':'')+'>'+esc(t)+'</option>'; }).join('')
    + '</select></div>';
}

function telaLancamentos(){
  const t = FILTROS.busca, fSub = FILTROS.fSub || '', fFil = FILTROS.fFil || '';
  const L = (DB.LANCAMENTOS||[])
    .filter(l => casa(l, ['PASTA','CLIENTE','N_PROCESSO','PRACA','DOC','SUBCLASSE'], t))
    .filter(l => (!fSub || l.SUBCLASSE === fSub) && (!fFil || l.FILIAL === fFil))
    .sort((a,b) => String(b.CRIADO_EM||'').localeCompare(String(a.CRIADO_EM||'')));

  const linhas = L.length ? L.map(l => {
    const ps = (DB.PARCELAS||[]).filter(p => p.LANC_ID === l.ID);
    const recb = ps.filter(p => p.STATUS === 'Recebida');
    const totRec = recb.reduce((s,p) => s + n(p.VALOR_CREDITADO || p.VALOR), 0);
    const tot = ps.reduce((s,p) => s + n(p.VALOR), 0);
    const pct = tot ? Math.round(totRec/tot*100) : 0;
    return '<tr><td>'+pastaCliente(l.PASTA, l.CLIENTE)+'</td>'
      + '<td>'+esc(l.N_PROCESSO||'—')+'<div class="mini">'+esc(l.PRACA||'')+'</div></td>'
      + '<td>'+esc(l.SUBCLASSE||'—')+(l.EXEZ==='SIM'?' <span class="tag t-neutro">EXEZ</span>':'')+'</td>'
      + '<td class="num">'+nMoeda(l.VALOR_TOTAL)+'</td>'
      + '<td class="num">'+nMoeda(l.SUCUMBENCIA)+'</td>'
      + '<td class="num">'+n(l.PCT_CLIENTE)+'% / '+n(l.PCT_ESCRITORIO)+'%</td>'
      + '<td>'+recb.length+' de '+ps.length+'<div class="barra"><i style="width:'+pct+'%"></i></div></td>'
      + '<td style="text-align:right;white-space:nowrap">'
      + '<button class="btn sm sec" onclick="verParcelas(\''+l.ID+'\')">Parcelas</button> '
      + '<button class="btn sm sec" onclick="formLanc(\''+l.ID+'\')">Editar</button> '
      + '<button class="btn sm per" onclick="excluirLanc(\''+l.ID+'\')">Excluir</button></td></tr>';
  }).join('') : '<tr><td colspan="8">'+vazio('Nenhum lançamento','Registre um acordo para gerar as parcelas em contas a receber.')+'</td></tr>';

  return cabec('Lançamentos', 'Acordos, parcelas, rateio cliente/escritório e sucumbência',
      '<button class="btn" onclick="formLanc()">Novo lançamento</button>')
    + '<div class="filtros">' + campoBusca('Pasta, cliente, processo…')
    + sel('fSub','Subclasse', [['','Todas']].concat((DB.SUBCLASSES||[]).map(s => [s.NOME,s.NOME])), fSub, '', 'onchange="setF(\'fSub\',this.value)"')
    + sel('fFil','Filial', [['','Todas']].concat((DB.FILIAIS||[]).map(f => [f.NOME,f.NOME])), fFil, '', 'onchange="setF(\'fFil\',this.value)"')
    + '</div>'
    + '<div class="card"><div class="tw"><table><thead><tr><th>Pasta / cliente</th><th>Processo / praça</th><th>Subclasse</th>'
    + '<th class="num">Valor total</th><th class="num">Sucumbência</th><th class="num">Rateio</th><th>Recebido</th><th></th></tr></thead>'
    + '<tbody>'+linhas+'</tbody></table></div></div>';
}

/* ── Formulário de lançamento ── */
let PARC_TMP = [];
function formLanc(id){
  const l = id ? lancDe(id) : {};
  PARC_TMP = id ? (DB.PARCELAS||[]).filter(p => p.LANC_ID === id && p.TIPO !== 'Sucumbência')
                    .sort((a,b) => n(a.NUM) - n(b.NUM))
                    .map(p => ({ID:p.ID, VENCIMENTO:p.VENCIMENTO, VALOR:n(p.VALOR), STATUS:p.STATUS}))
                : [];
  const subs = [['','— selecione —']].concat((DB.SUBCLASSES||[]).map(s => [s.NOME, s.NOME]));
  const fils = [['','— selecione —']].concat((DB.FILIAIS||[]).filter(f => f.ATIVO !== 'NAO').map(f => [f.NOME, f.NOME]));
  const prcs = [['','— selecione —']].concat((DB.PRACAS||[]).filter(f => f.ATIVO !== 'NAO')
                 .map(f => [f.NOME, f.NOME + (f.UF ? ' / ' + f.UF : '')]));
  // valor gravado que já não existe mais no cadastro continua visível para não sumir do lançamento
  [[prcs, l.PRACA], [fils, l.FILIAL], [subs, l.SUBCLASSE]].forEach(([lista, v]) => {
    if (v && !lista.some(o => o[0] === v)) lista.push([v, v + ' (fora do cadastro)']);
  });
  const faltando = [];
  if (!(DB.PRACAS||[]).length) faltando.push('praças');
  if (!(DB.FILIAIS||[]).length) faltando.push('filiais');
  if (!(DB.SUBCLASSES||[]).length) faltando.push('subclasses');
  const aviso = faltando.length
    ? '<div class="erro" style="margin-bottom:14px">Ainda não há '+faltando.join(', ')+' no cadastro. '
      + '<button class="btn sm sec" onclick="abrirConfig(\''+(faltando[0]==='praças'?'pracas':faltando[0]==='filiais'?'filiais':'subclasses')+'\')">Abrir cadastro</button></div>'
    : '';

  modal(id ? 'Editar lançamento' : 'Novo lançamento',
    aviso + '<div class="grade">'
    + inp('lcPasta','Pasta', l.PASTA)
    + inp('lcCliente','Cliente', l.CLIENTE)
    + inp('lcDoc','CPF / CNPJ do cliente', l.DOC)
    + inp('lcProc','Nº do processo', l.N_PROCESSO)
    + sel('lcPraca','Praça', prcs, l.PRACA)
    + sel('lcFilial','Filial', fils, l.FILIAL)
    + sel('lcSub','Subclasse', subs, l.SUBCLASSE)
    + '<div class="check"><input type="checkbox" id="lcExez"'+(l.EXEZ==='SIM'?' checked':'')+'><label for="lcExez">Cálculo feito pela EXEZ</label></div>'

    + '<div class="secao-form">Valores e rateio</div>'
    + inp('lcTotal','Valor total do acordo (R$)', l.VALOR_TOTAL ? nMoeda(l.VALOR_TOTAL) : '', '', 'text', 'oninput="recalcParcelas()"')
    + inp('lcQtd','Quantidade de parcelas', l.QTD_PARCELAS || (PARC_TMP.length || 1), '', 'number', 'min="1" oninput="recalcParcelas()"')
    + inp('lcPrim','1º vencimento', PARC_TMP[0] ? PARC_TMP[0].VENCIMENTO : hoje(), '', 'date', 'oninput="recalcParcelas()"')
    + inp('lcPctCli','% do cliente', l.PCT_CLIENTE || '70', '', 'number', 'step="0.01" oninput="espelhaPct(1)"')
    + inp('lcPctEsc','% do escritório', l.PCT_ESCRITORIO || '30', '', 'number', 'step="0.01" oninput="espelhaPct(2)"')
    + inp('lcSuc','Honorários de sucumbência (R$)', l.SUCUMBENCIA ? nMoeda(l.SUCUMBENCIA) : '')
    + '<div class="check"><input type="checkbox" id="lcTarifa"'+(l.TARIFA_ATIVA!=='NAO'?' checked':'')+'><label for="lcTarifa">Deduzir tarifa bancária da parte do cliente</label></div>'
    + inp('lcTarifaV','Valor da tarifa por parcela (R$)', l.TARIFA_VALOR ? nMoeda(l.TARIFA_VALOR) : nMoeda(tarifaPadrao()))
    + '<p class="mini full" style="margin:-4px 0 2px">A tarifa é descontada da parte do cliente em cada parcela e passa para o escritório. Ela não entra na base de cálculo das comissões.</p>'

    + '<div class="secao-form">Vencimento e valor de cada parcela</div>'
    + '<div class="full" id="boxParcelas"></div>'
    + '<div class="campo full"><label for="lcObs">Observações</label><textarea id="lcObs" rows="2">'+esc(l.OBS||'')+'</textarea></div>'
    + '</div>',
    '<button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn" onclick="gravarLanc(\''+(id||'')+'\')">Salvar lançamento</button>',
    'larga');
  pintarParcelas();
  if (!id) recalcParcelas();
}
function espelhaPct(origem){
  const cli = document.getElementById('lcPctCli'), esce = document.getElementById('lcPctEsc');
  if (origem === 1) esce.value = rd(100 - n(cli.value)); else cli.value = rd(100 - n(esce.value));
}
function recalcParcelas(){
  const qtd = Math.max(1, parseInt(val('lcQtd')) || 1);
  const total = n(val('lcTotal'));
  const prim = val('lcPrim') || hoje();
  const base = total ? rd(total / qtd) : 0;
  const novas = [];
  for (let i=0;i<qtd;i++){
    const ant = PARC_TMP[i];
    if (ant && ant.STATUS === 'Recebida'){ novas.push(ant); continue; }
    const d = new Date(prim + 'T12:00'); d.setMonth(d.getMonth() + i);
    let v = base;
    if (i === qtd-1 && total) v = rd(total - base*(qtd-1));
    novas.push({ID: ant ? ant.ID : '', VENCIMENTO: d.toISOString().slice(0,10), VALOR: v, STATUS:'A receber'});
  }
  PARC_TMP = novas; pintarParcelas();
}
function pintarParcelas(){
  const box = document.getElementById('boxParcelas'); if (!box) return;
  if (!PARC_TMP.length){ box.innerHTML = '<p class="mini">Informe o valor total e a quantidade de parcelas.</p>'; return; }
  const soma = PARC_TMP.reduce((s,p) => s + n(p.VALOR), 0);
  box.innerHTML = '<div class="tw"><table><thead><tr><th>#</th><th>Vencimento</th><th class="num">Valor (R$)</th><th>Situação</th></tr></thead><tbody>'
    + PARC_TMP.map((p,i) =>
      '<tr><td>'+(i+1)+'</td>'
      + '<td><input type="date" value="'+esc(p.VENCIMENTO)+'" '+(p.STATUS==='Recebida'?'disabled':'')+' onchange="PARC_TMP['+i+'].VENCIMENTO=this.value" style="padding:4px 6px;border:1px solid var(--line);border-radius:4px"></td>'
      + '<td class="num"><input value="'+nMoeda(p.VALOR)+'" '+(p.STATUS==='Recebida'?'disabled':'')+' oninput="PARC_TMP['+i+'].VALOR=n(this.value)" onblur="pintarParcelas()" style="width:110px;text-align:right;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-family:\'IBM Plex Mono\',monospace"></td>'
      + '<td><span class="tag '+(p.STATUS==='Recebida'?'t-ok':'t-pend')+'">'+esc(p.STATUS||'A receber')+'</span></td></tr>').join('')
    + '</tbody><tfoot><tr><th colspan="2" style="text-align:right">Soma das parcelas</th><th class="num">'+nMoeda(soma)+'</th><th></th></tr></tfoot></table></div>'
    + '<p class="mini" style="margin-top:6px">Parcelas já recebidas não podem ser alteradas. A sucumbência entra como um recebimento próprio, 100% do escritório.</p>';
}
async function gravarLanc(id){
  if (!val('lcCliente')) return toast('Informe o cliente.','erro');
  if (!PARC_TMP.length) return toast('Gere ao menos uma parcela.','erro');
  const pctCli = n(val('lcPctCli')), pctEsc = n(val('lcPctEsc'));
  if (rd(pctCli + pctEsc) !== 100) return toast('Os percentuais de cliente e escritório devem somar 100%.','erro');

  const lanc = {
    ID: id || uid('l'), PASTA: val('lcPasta'), CLIENTE: val('lcCliente'), DOC: val('lcDoc'),
    N_PROCESSO: val('lcProc'), PRACA: val('lcPraca'), FILIAL: val('lcFilial'),
    VALOR_TOTAL: rd(PARC_TMP.reduce((s,p)=>s+n(p.VALOR),0)), QTD_PARCELAS: PARC_TMP.length,
    PCT_CLIENTE: pctCli, PCT_ESCRITORIO: pctEsc,
    TARIFA_ATIVA: val('lcTarifa') ? 'SIM' : 'NAO', TARIFA_VALOR: rd(n(val('lcTarifaV'))),
    SUCUMBENCIA: rd(n(val('lcSuc'))), SUBCLASSE: val('lcSub'), EXEZ: val('lcExez') ? 'SIM' : 'NAO',
    OBS: val('lcObs'), STATUS: 'Ativo',
    CRIADO_EM: (id && lancDe(id).CRIADO_EM) || new Date().toISOString().slice(0,16).replace('T',' '),
    CRIADO_POR: (id && lancDe(id).CRIADO_POR) || (USER ? USER.NOME : '')
  };

  const excluirCP = [];
  const lote = [{aba:'LANCAMENTOS', registro:lanc}];
  PARC_TMP.forEach((p,i) => {
    const antiga = p.ID ? parcDe(p.ID) : null;
    if (antiga && antiga.STATUS === 'Recebida') return;
    const parcId = p.ID || uid('p');
    const tarifa = lanc.TARIFA_ATIVA === 'SIM' ? rd(n(lanc.TARIFA_VALOR) || tarifaPadrao()) : 0;
    const vCli = rd(n(p.VALOR) * pctCli / 100 - tarifa);
    const cpAntigo = (DB.CONTAS_PAGAR||[]).find(c => c.ID === (antiga||{}).CP_ID)
                  || (DB.CONTAS_PAGAR||[]).find(c => c.PARCELA_ID === parcId && c.CATEGORIA === 'Repasse a cliente');
    const cpId = vCli > 0 ? (cpAntigo ? cpAntigo.ID : uid('cp')) : '';
    lote.push({aba:'PARCELAS', registro: Object.assign({}, antiga || {}, {
      ID: parcId, LANC_ID: lanc.ID, TIPO:'Parcela', NUM: i+1,
      VENCIMENTO: p.VENCIMENTO, VALOR: rd(p.VALOR), STATUS:'A receber',
      DATA_CREDITO:'', VALOR_CREDITADO:'', MOV_ID:'', VALOR_CLIENTE:'', VALOR_ESCRITORIO:'', TARIFA:'', CP_ID: cpId, OBS:''
    })});
    // repasse ao cliente já entra em contas a pagar, bloqueado até a conciliação
    if (vCli > 0){
      lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, cpAntigo || {}, {
        ID: cpId, DESCRICAO:'Repasse ao cliente — pasta '+(lanc.PASTA||'—')+' · parcela '+(i+1)+'/'+PARC_TMP.length,
        FAVORECIDO: lanc.CLIENTE || '', CATEGORIA:'Repasse a cliente', VENCIMENTO: p.VENCIMENTO, VALOR: vCli,
        STATUS: (cpAntigo && cpAntigo.STATUS) || 'Em aberto', DATA_PGTO: (cpAntigo && cpAntigo.DATA_PGTO) || '',
        ORIGEM:'Repasse de parcela', PARCELA_ID: parcId, ANEXO_URL:'',
        OBS:'Valor previsto — aguardando o crédito da parcela'
      })});
    } else if (cpAntigo){
      excluirCP.push({aba:'CONTAS_PAGAR', id: cpAntigo.ID});
    }
  });

  // sucumbência como recebimento próprio (100% escritório)
  const sucAtual = (DB.PARCELAS||[]).find(p => p.LANC_ID === lanc.ID && p.TIPO === 'Sucumbência');
  const excluir_ = [];
  if (n(lanc.SUCUMBENCIA) > 0){
    if (!sucAtual || sucAtual.STATUS !== 'Recebida'){
      lote.push({aba:'PARCELAS', registro:{
        ID: sucAtual ? sucAtual.ID : uid('s'), LANC_ID: lanc.ID, TIPO:'Sucumbência', NUM: 0,
        VENCIMENTO: PARC_TMP[PARC_TMP.length-1].VENCIMENTO, VALOR: rd(lanc.SUCUMBENCIA),
        STATUS:'A receber', DATA_CREDITO:'', VALOR_CREDITADO:'', MOV_ID:'',
        VALOR_CLIENTE:'', VALOR_ESCRITORIO:'', TARIFA:'', CP_ID:'', OBS:'Honorários de sucumbência'
      }});
    }
  } else if (sucAtual && sucAtual.STATUS !== 'Recebida'){
    excluir_.push({aba:'PARCELAS', id: sucAtual.ID});
  }

  // parcelas removidas (redução da quantidade)
  const idsMantidos = new Set(lote.filter(x => x.aba === 'PARCELAS').map(x => x.registro.ID));
  (DB.PARCELAS||[]).filter(p => p.LANC_ID === lanc.ID && p.TIPO !== 'Sucumbência'
      && !idsMantidos.has(p.ID) && p.STATUS !== 'Recebida')
    .forEach(p => {
      excluir_.push({aba:'PARCELAS', id:p.ID});
      const cp = (DB.CONTAS_PAGAR||[]).find(c => c.PARCELA_ID === p.ID && c.CATEGORIA === 'Repasse a cliente');
      if (cp && cp.STATUS !== 'Pago') excluir_.push({aba:'CONTAS_PAGAR', id:cp.ID});
    });
  excluirCP.forEach(x => excluir_.push(x));

  carregandoOn('Salvando lançamento…');
  try{
    await salvarLote(lote);
    if (excluir_.length){
      await api({action:'excluirLote', lote: excluir_});
      const ids = new Set(excluir_.map(e => e.id));
      DB.PARCELAS = (DB.PARCELAS||[]).filter(p => !ids.has(p.ID));
    }
    fecharModal(); render(); toast('Lançamento salvo. O repasse ao cliente já está em contas a pagar, bloqueado até a conciliação.','ok');
  }catch(e){ toast(e.message,'erro'); }
  finally{ carregandoOff(); }
}
async function excluirLanc(id){
  const l = lancDe(id);
  const ps = (DB.PARCELAS||[]).filter(p => p.LANC_ID === id);
  if (ps.some(p => p.STATUS === 'Recebida'))
    return toast('Há parcelas já conciliadas. Desfaça a conciliação antes de excluir.','erro');
  if (!confirm('Excluir o lançamento de "'+(l.CLIENTE||'')+'" e suas '+ps.length+' parcela(s)?')) return;
  carregandoOn('Excluindo…');
  try{
    const ids = new Set(ps.map(p => p.ID));
    const cps = (DB.CONTAS_PAGAR||[]).filter(c => ids.has(c.PARCELA_ID) && c.STATUS !== 'Pago');
    await api({action:'excluirLote', lote: ps.map(p => ({aba:'PARCELAS', id:p.ID}))
      .concat(cps.map(c => ({aba:'CONTAS_PAGAR', id:c.ID})))
      .concat([{aba:'LANCAMENTOS', id}])});
    const idsCp = new Set(cps.map(c => c.ID));
    DB.CONTAS_PAGAR = (DB.CONTAS_PAGAR||[]).filter(c => !idsCp.has(c.ID));
    DB.PARCELAS = (DB.PARCELAS||[]).filter(p => !ids.has(p.ID));
    DB.LANCAMENTOS = (DB.LANCAMENTOS||[]).filter(l2 => l2.ID !== id);
    render(); toast('Lançamento excluído.','ok');
  }catch(e){ toast(e.message,'erro'); } finally{ carregandoOff(); }
}

    '<button class="btn sec" onclick="fecharModal()">Fechar</button>', 'larga');
}
/* ══════════════════ CONCILIAÇÃO BANCÁRIA ══════════════════
   Regra do sistema: nada é recebido nem pago manualmente.
   Uma parcela só vira "recebida" e uma conta só vira "paga"
   quando o movimento correspondente do extrato é conciliado.
   ═══════════════════════════════════════════════════════════ */
function pendentesReceber(){
  return (DB.PARCELAS||[]).filter(p => p.STATUS !== 'Recebida');
}
function trechosNum(txt, min){
  const out = new Set();
  (String(txt||'').match(/\d{4,}/g) || []).forEach(s => { if (s.length >= (min||6)) out.add(s); });
  return [...out];
}
/* candidatos para um crédito na conta: parcelas em aberto e recebimentos avulsos */
function candidatosCredito(){
  const out = [];
  pendentesReceber().forEach(p => {
    const l = lancDe(p.LANC_ID);
    out.push({ tipo:'parcela', id:p.ID, valor:n(p.VALOR), venc:p.VENCIMENTO,
      titulo:l.CLIENTE || '—', sub:p.TIPO + (p.NUM>0?' '+p.NUM:''),
      detalhe:'Pasta ' + (l.PASTA||'—') + ' · proc. ' + (l.N_PROCESSO||'—'),
      doc:l.DOC, proc:l.N_PROCESSO, nome:l.CLIENTE, pasta:l.PASTA });
  });
  (DB.CONTAS_RECEBER||[]).filter(c => c.STATUS !== 'Recebido').forEach(c => {
    out.push({ tipo:'receber', id:c.ID, valor:n(c.VALOR), venc:c.VENCIMENTO,
      titulo:c.CLIENTE || c.DESCRICAO || '—', sub:c.CATEGORIA || 'Avulso',
      detalhe:c.DESCRICAO || '', doc:'', proc:'', nome:c.CLIENTE, pasta:'' });
  });
  return out;
}
/* candidatos para um débito na conta: contas a pagar em aberto e já liberadas */
function candidatosDebito(){
  return (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS !== 'Pago' && liberacao(c).tipo !== 'nao').map(c => ({
    tipo:'pagar', id:c.ID, valor:n(c.VALOR), venc:c.VENCIMENTO,
    titulo:c.FAVORECIDO || c.DESCRICAO || '—', sub:c.CATEGORIA || '',
    detalhe:c.DESCRICAO || '', doc:'', proc:'', nome:c.FAVORECIDO, pasta:'' }));
}
const ehDebito = mov => n(mov.VALOR) < 0;

function sugestoes(mov, ignorarData){
  const desc = String(mov.IDENTIFICACAO||''), descNum = digitos(desc), vm = Math.abs(n(mov.VALOR));
  const res = [];
  (ehDebito(mov) ? candidatosDebito() : candidatosCredito()).forEach(c => {
    let s = 0; const por = [];
    const dif = Math.abs(c.valor - vm);
    if (dif <= 0.01){ s += 50; por.push('valor idêntico'); }
    else if (dif <= Math.max(5, c.valor*0.01)){ s += 28; por.push('valor próximo (dif. '+moeda(dif)+')'); }

    const doc = digitos(c.doc);
    if (doc.length >= 11 && descNum.includes(doc)){ s += 40; por.push('CNPJ/CPF do cliente na descrição'); }

    const proc = digitos(c.proc);
    if (proc.length >= 6){
      const achou = trechosNum(desc, 6).some(t => proc.includes(t) || t.includes(proc.slice(0,9)));
      if (achou){ s += 45; por.push('número do processo (parcial) na descrição'); }
    }
    const nomes = String(c.nome||'').toUpperCase().split(/\s+/).filter(w => w.length > 3);
    if (nomes.length && nomes.some(w => desc.toUpperCase().includes(w))){ s += 15; por.push('nome na descrição'); }
    if (c.pasta && desc.toUpperCase().includes(String(c.pasta).toUpperCase())){ s += 20; por.push('pasta na descrição'); }

    if (!ignorarData){
      const d = diasEntre(c.venc, mov.DATA);
      if (d <= 3){ s += 12; por.push('vencimento na mesma semana'); }
      else if (d <= 15){ s += 6; }
    }
    if (s > 0) res.push({c, score:s, por});
  });
  return res.sort((a,b) => b.score - a.score).slice(0,6);
}
function boxSugestoes(mov, ignorarData, vazioTxt){
  const sg = sugestoes(mov, ignorarData);
  const deb = ehDebito(mov);
  if (!sg.length) return '<p class="mini">'
    + esc(vazioTxt || (deb ? 'Nenhuma conta a pagar em aberto compatível com este débito.'
                           : 'Sem correspondência em contas a receber.'))
    + ' <button class="btn sm sec" onclick="marcarNaoIdentificado(\''+mov.ID+'\')">Marcar como não identificado</button></p>';
  return sg.map(x =>
    '<div class="sug"><div class="info"><b>'+esc(x.c.titulo)+'</b> · '+moeda(x.c.valor)
    + ' <span class="mini">('+esc(x.c.sub)+', venc. '+dataBR(x.c.venc)+')</span>'
    + '<div class="porq">'+esc(x.c.detalhe)+(x.c.detalhe?' — ':'')+esc(x.por.join('; '))+'</div></div>'
    + '<span class="score '+(x.score>=80?'alto':x.score<40?'baixo':'')+'">'+x.score+'</span>'
    + '<button class="btn sm ok" onclick="conciliar(\''+mov.ID+'\',\''+x.c.id+'\')">'
    + (deb ? 'Conciliar pagamento' : 'Conciliar') + '</button></div>').join('');
}

function telaConciliacao(){
  const sub = SUB || 'pendentes';
  const conta = FILTROS.fConta || '';
  const M = (DB.EXTRATO||[]).filter(m => !conta || m.BANCO === conta);
  const pend = M.filter(m => m.STATUS === 'Pendente');
  const naoId = M.filter(m => m.STATUS === 'Nao identificado');
  const conc = M.filter(m => m.STATUS === 'Conciliado');
  const dup = duplicidades(M);
  const credPend = pend.filter(m => !ehDebito(m)), debPend = pend.filter(ehDebito);

  const topo = cabec('Conciliação bancária',
      'Recebimentos e pagamentos só se efetivam aqui. Nada é baixado manualmente.',
      '<button class="btn sec" onclick="formImportar()">Importar extrato</button>'
    + '<button class="btn sec" onclick="formMovManual()">Lançar movimento</button>'
    + '<button class="btn sec" onclick="abrirConfig(\'contas\')">Contas bancárias</button>')
    + ((DB.CONTAS_BANCO||[]).length
        ? '<div class="filtros">' + sel('fConta','Conta bancária', opcoesContas(true), conta, '', 'onchange="setF(\'fConta\',this.value)"')
          + '<div class="campo" style="min-width:0"><label>&nbsp;</label>'
          + '<button class="btn sec" onclick="abrirConfig(\'contas\')">Adicionar conta</button></div></div>'
        : '<div class="card" style="border-left:3px solid var(--brass)"><div class="corpo">'
          + '<b>Nenhuma conta bancária cadastrada.</b> <span class="mini">Cadastre as contas do escritório para separar os extratos e filtrar a conciliação por conta.</span> '
          + '<button class="btn sm" onclick="abrirConfig(\'contas\')">Cadastrar conta</button></div></div>')
    + '<div class="kpis">'
    + kpi('Créditos a conferir', credPend.length, moeda(credPend.reduce((s,m)=>s+n(m.VALOR),0)), 'b')
    + kpi('Débitos a conferir', debPend.length, moeda(debPend.reduce((s,m)=>s+n(m.VALOR),0)), 'b')
    + kpi('Não identificados', naoId.length, 'depósitos sem origem definida', naoId.length ? 'n' : '')
    + kpi('Conciliados', conc.length, moeda(conc.reduce((s,m)=>s+n(m.VALOR),0)), 'p')
    + '</div>'
    + subtabs([['pendentes','Pendentes ('+pend.length+')'],
               ['naoid','Depósitos não identificados ('+naoId.length+')'],
               ['conciliados','Conciliados ('+conc.length+')'],
               ['divergencias','Duplicidades e divergências ('+dup.length+')']]);

  if (sub === 'pendentes') return topo + listaPendentes(pend);
  if (sub === 'naoid') return topo + listaNaoIdentificados(naoId);
  if (sub === 'conciliados') return topo + listaConciliados(conc);
  return topo + listaDivergencias(dup);
}
function kpi(rot, val, sub, cls){
  return '<div class="kpi '+(cls||'d')+'"><div class="rot">'+esc(rot)+'</div><div class="val">'+esc(String(val))+'</div><div class="sub">'+esc(sub||'')+'</div></div>';
}
function duplicidades(M){
  const mapa = {}, out = [];
  M.forEach(m => {
    const k = (m.BANCO||'') + '|' + m.DATA + '|' + rd(m.VALOR) + '|' + String(m.IDENTIFICACAO||'').slice(0,40).toUpperCase();
    (mapa[k] = mapa[k] || []).push(m);
  });
  Object.values(mapa).forEach(g => { if (g.length > 1) out.push(...g); });
  return out;
}
function linhaMov(m, extra){
  return '<td>'+dataBR(m.DATA)+'</td><td>'+esc(m.IDENTIFICACAO||'—')

    + '<td class="num '+(n(m.VALOR)<0?'neg':'pos')+'">'+nMoeda(m.VALOR)+'</td>' + (extra||'');

    + (ehDebito(m) ? 'Contas a pagar em aberto com o mesmo valor:'
                   : 'Pastas em aberto com o mesmo valor — inclusive acordos lançados depois da data do crédito:') + '</p>'

/* descreve o destino de um movimento já conciliado */
function alvoDe(mov){
  const id = mov.PARCELA_ID;
  const p = parcDe(id);
  if (p){ const l = lancDe(p.LANC_ID);
    return {tipo:'parcela', p, l, quem:pastaCliente(l.PASTA, l.CLIENTE),
            cli:n(p.VALOR_CLIENTE), esc:n(p.VALOR_ESCRITORIO)}; }
  const cp = (DB.CONTAS_PAGAR||[]).find(x => x.ID === id);
  if (cp) return {tipo:'pagar', cp, quem:'<b>'+esc(cp.FAVORECIDO||cp.DESCRICAO||'—')+'</b>'
            + '<div class="mini">'+esc(cp.CATEGORIA||'')+'</div>', cli:0, esc:0};
  const cr = (DB.CONTAS_RECEBER||[]).find(x => x.ID === id);
  if (cr) return {tipo:'receber', cr, quem:'<b>'+esc(cr.CLIENTE||cr.DESCRICAO||'—')+'</b>', cli:0, esc:n(cr.VALOR)};
  return {tipo:'', quem:'<span class="mini">—</span>', cli:0, esc:0};
}
function listaConciliados(L){
  const t = FILTROS.busca;
  const F = L.filter(m => casa(m, ['IDENTIFICACAO','DATA'], t)).sort((a,b) => String(b.DATA).localeCompare(String(a.DATA)));

      + '</tbody></table></div>' : vazio('Sem duplicidades','Nenhum movimento repetido com mesma data, valor e descrição.'))

        return '<tr>' + linhaMov(m) + '<td>' + (s ? esc(s.c.titulo) + ' — ' + moeda(s.c.valor) + ' <span class="mini">(dif. '

      + '</tbody></table></div>' : vazio('Sem divergências','Todos os movimentos pendentes têm registro de valor idêntico.'))

/* ── Conciliar ── */
async function conciliar(movId, alvoId){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId);
  if (!m) return toast('Movimento não encontrado.','erro');
  const p = parcDe(alvoId);
  const cp = (DB.CONTAS_PAGAR||[]).find(x => x.ID === alvoId);
  const cr = (DB.CONTAS_RECEBER||[]).find(x => x.ID === alvoId);
  if (p) return conciliarParcela(m, p);
  if (cp) return conciliarPagamento(m, cp);
  if (cr) return conciliarRecebimento(m, cr);
  toast('Registro de destino não encontrado.','erro');
}

async function conciliarParcela(m, p){
  const l = lancDe(p.LANC_ID);
  const valor = Math.abs(n(m.VALOR));
  const suc = p.TIPO === 'Sucumbência';
  const tarifa = (!suc && l.TARIFA_ATIVA !== 'NAO') ? rd(n(l.TARIFA_VALOR) || tarifaPadrao()) : 0;
  // base de comissão = parte do escritório SEM a tarifa; a tarifa sai do cliente e entra no escritório
  const baseCom = suc ? valor : rd(valor * n(l.PCT_ESCRITORIO) / 100);
  const vEsc = rd(baseCom + tarifa);
  const vCli = suc ? 0 : rd(valor * n(l.PCT_CLIENTE) / 100 - tarifa);

  const lote = [];
  const cpAntigo = (DB.CONTAS_PAGAR||[]).find(c => c.ID === p.CP_ID)
                || (DB.CONTAS_PAGAR||[]).find(c => c.PARCELA_ID === p.ID && c.CATEGORIA === 'Repasse a cliente');
  const cpId = vCli > 0 ? (cpAntigo ? cpAntigo.ID : uid('cp')) : '';

  lote.push({aba:'PARCELAS', registro: Object.assign({}, p, {
    STATUS:'Recebida', DATA_CREDITO:m.DATA, VALOR_CREDITADO:valor, MOV_ID:m.ID,
    VALOR_CLIENTE:vCli, VALOR_ESCRITORIO:vEsc, TARIFA:tarifa, CP_ID:cpId })});
  lote.push({aba:'EXTRATO', registro: Object.assign({}, m, {STATUS:'Conciliado', PARCELA_ID:p.ID})});

  if (vCli > 0){
    // o repasse já existe desde o lançamento: aqui ele é liberado e ajustado ao valor creditado
    lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, cpAntigo || {}, {
      ID:cpId, DESCRICAO:(cpAntigo && cpAntigo.DESCRICAO) || ('Repasse ao cliente — pasta '+(l.PASTA||'—')+(p.NUM>0?' · parcela '+p.NUM:'')),
      FAVORECIDO:l.CLIENTE||'', CATEGORIA:'Repasse a cliente', VENCIMENTO:m.DATA, VALOR:vCli,
      STATUS:(cpAntigo && cpAntigo.STATUS) || 'Em aberto', DATA_PGTO:(cpAntigo && cpAntigo.DATA_PGTO) || '',
      ORIGEM:'Repasse de parcela', PARCELA_ID:p.ID, ANEXO_URL:(cpAntigo && cpAntigo.ANEXO_URL) || '',
      OBS:'Liberado — crédito de '+moeda(valor)+' conciliado em '+dataBR(m.DATA)
          +(tarifa?' · tarifa de '+moeda(tarifa)+' revertida ao escritório':'') })});
  }
  (DB.REGRAS_COMISSAO||[]).filter(r => r.SUBCLASSE && r.SUBCLASSE === l.SUBCLASSE).forEach(r => {
    const v = rd(baseCom * n(r.PCT) / 100);
    if (v <= 0) return;
    lote.push({aba:'COMISSOES', registro:{ ID:uid('co'), PARCELA_ID:p.ID, LANC_ID:l.ID, CLIENTE:l.CLIENTE||'',
      COMISSIONADO_ID:r.COMISSIONADO_ID, BASE:baseCom, PCT:n(r.PCT), VALOR:v, STATUS:'A pagar', DATA:m.DATA, CP_ID:'' }});
  });

  carregandoOn('Conciliando…');
  try{
    await salvarLote(lote); render();
    toast('Recebimento conciliado. ' + (vCli > 0 ? moeda(vCli)+' liberado para o cliente · '+moeda(vEsc)+' para o escritório.'
                                                 : 'Valor integral do escritório.'), 'ok');
  }catch(e){ toast(e.message,'erro'); } finally{ carregandoOff(); }
}

async function conciliarPagamento(m, cp){
  if (liberacao(cp).tipo === 'nao')
    return toast('A parcela deste cliente ainda não foi conciliada. Concilie o crédito antes de baixar o pagamento.','erro');
  const valor = Math.abs(n(m.VALOR));
  const lote = [
    {aba:'CONTAS_PAGAR', registro: Object.assign({}, cp, {STATUS:'Pago', DATA_PGTO:m.DATA, VALOR:valor,
      OBS:'Pago pelo débito de '+moeda(valor)+' conciliado em '+dataBR(m.DATA)})},
    {aba:'EXTRATO', registro: Object.assign({}, m, {STATUS:'Conciliado', PARCELA_ID:cp.ID})}
  ];
  (DB.COMISSOES||[]).filter(c => c.CP_ID === cp.ID).forEach(c =>
    lote.push({aba:'COMISSOES', registro: Object.assign({}, c, {STATUS:'Paga'})}));
  carregandoOn('Baixando pagamento…');
  try{ await salvarLote(lote); render(); toast('Pagamento de '+moeda(valor)+' baixado.','ok'); }
  catch(e){ toast(e.message,'erro'); } finally{ carregandoOff(); }
}

async function conciliarRecebimento(m, cr){
  const valor = Math.abs(n(m.VALOR));
  const lote = [
    {aba:'CONTAS_RECEBER', registro: Object.assign({}, cr, {STATUS:'Recebido', DATA_RECEB:m.DATA, VALOR:valor,
      OBS:'Recebido pelo crédito conciliado em '+dataBR(m.DATA)})},
    {aba:'EXTRATO', registro: Object.assign({}, m, {STATUS:'Conciliado', PARCELA_ID:cr.ID})}
  ];
  carregandoOn('Conciliando…');
  try{ await salvarLote(lote); render(); toast('Recebimento de '+moeda(valor)+' conciliado.','ok'); }
  catch(e){ toast(e.message,'erro'); } finally{ carregandoOff(); }
}

/* ── Desfazer ── */
async function desfazer(movId){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId); if (!m) return;
  const a = alvoDe(m);
  const apagar = [], lote = [];

  if (a.tipo === 'parcela'){
    const p = a.p, l = a.l;
    const cp = (DB.CONTAS_PAGAR||[]).find(c => c.ID === p.CP_ID || (c.PARCELA_ID === p.ID && c.CATEGORIA === 'Repasse a cliente'));
    if (cp && cp.STATUS === 'Pago')
      return toast('O repasse ao cliente já foi pago. Desfaça primeiro a conciliação desse pagamento.','erro');
    if (!confirm('Desfazer? A parcela volta para contas a receber, o repasse ao cliente volta a ficar bloqueado e as comissões geradas são removidas.')) return;
    if (cp){
      const tar = (p.TIPO !== 'Sucumbência' && l.TARIFA_ATIVA !== 'NAO') ? rd(n(l.TARIFA_VALOR) || tarifaPadrao()) : 0;
      lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, cp, {
        VENCIMENTO:p.VENCIMENTO, VALOR:rd(n(p.VALOR) * n(l.PCT_CLIENTE) / 100 - tar),
        STATUS:'Em aberto', DATA_PGTO:'', OBS:'Valor previsto — aguardando o crédito da parcela' })});
    }
    (DB.COMISSOES||[]).filter(c => c.PARCELA_ID === p.ID && c.STATUS !== 'Paga')
      .forEach(c => apagar.push({aba:'COMISSOES', id:c.ID}));
    lote.push({aba:'PARCELAS', registro: Object.assign({}, p, {STATUS:'A receber', DATA_CREDITO:'', VALOR_CREDITADO:'',
      MOV_ID:'', VALOR_CLIENTE:'', VALOR_ESCRITORIO:'', TARIFA:''})});

  } else if (a.tipo === 'pagar'){
    if (!confirm('Desfazer a baixa deste pagamento? A conta volta para "em aberto".')) return;
    lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, a.cp, {STATUS:'Em aberto', DATA_PGTO:'',
      OBS:'Baixa desfeita em '+dataBR(hoje())})});
    (DB.COMISSOES||[]).filter(c => c.CP_ID === a.cp.ID).forEach(c =>
      lote.push({aba:'COMISSOES', registro: Object.assign({}, c, {STATUS:'Enviada'})}));

  } else if (a.tipo === 'receber'){
    if (!confirm('Desfazer? A conta volta para contas a receber.')) return;
    lote.push({aba:'CONTAS_RECEBER', registro: Object.assign({}, a.cr, {STATUS:'Em aberto', DATA_RECEB:''})});

  } else if (!confirm('Este movimento não aponta para nenhum registro. Voltar para pendentes?')) return;

  lote.push({aba:'EXTRATO', registro: Object.assign({}, m, {STATUS:'Pendente', PARCELA_ID:''})});
  carregandoOn('Desfazendo…');
  try{
    await salvarLote(lote);
    if (apagar.length){
      await api({action:'excluirLote', lote:apagar});
      apagar.forEach(x => { DB[x.aba] = (DB[x.aba]||[]).filter(y => y.ID !== x.id); });
    }
    render(); toast('Conciliação desfeita.','ok');
  }catch(e){ toast(e.message,'erro'); } finally{ carregandoOff(); }
}

async function lerArquivo(inp){
  const f = inp.files[0]; if (!f) return;
  $('#impPrevia').innerHTML = '<p class="mini">Lendo arquivo…</p>';
  try{
    const nome = f.name.toLowerCase();
    let linhas = [];
    if (/\.(ofx|ofc|qfx)$/.test(nome)) linhas = parseOFX(await f.text());
    else if (/\.pdf$/.test(nome)) linhas = parseLinhas(await textoPDF(f));
    else if (/\.(csv|txt)$/.test(nome)) linhas = parseTabela(await tabelaDeCSV(await f.text()));
    else linhas = parseTabela(await tabelaDeExcel(f));
    if (!linhas.length){ $('#impPrevia').innerHTML = '<div class="erro">Nenhum movimento reconhecido. Confira se o arquivo traz data, identificação e valor.</div>'; return; }
    IMP_BRUTO = linhas; previaImport();
  }catch(e){
    $('#impPrevia').innerHTML = '<div class="erro">Não foi possível ler o arquivo: '+esc(e.message)+'</div>';
  }
}
function parseOFX(txt){
  const out = [];
  const blocos = txt.split(/<STMTTRN>/i).slice(1);
  blocos.forEach(b => {
    const g = tag => { const m = b.match(new RegExp('<'+tag+'>([^<\\r\\n]*)','i')); return m ? m[1].trim() : ''; };
    const data = isoDe(g('DTPOSTED').slice(0,8));
    const valor = n(g('TRNAMT').replace(',', '.'));
    const desc = [g('MEMO'), g('NAME'), g('CHECKNUM')].filter(Boolean).join(' — ');
    if (data && valor) out.push({DATA:data, IDENTIFICACAO:desc || g('TRNTYPE'), VALOR:rd(valor)});
  });
  return out;
}
async function tabelaDeExcel(f){
  const buf = await f.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:false, raw:false});
  const sh = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sh, {header:1, defval:'', raw:false});
}
async function tabelaDeCSV(txt){
  const sep = (txt.split('\n')[0].match(/;/g)||[]).length >= (txt.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
  return txt.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(sep).map(c => c.replace(/^"|"$/g,'').trim()));
}
function parseTabela(rows){
  if (!rows || !rows.length) return [];
  let iD = -1, iI = -1, iV = -1, ini = 0;
  for (let r=0; r<Math.min(12, rows.length); r++){
    const cab = rows[r].map(c => String(c||'').toLowerCase());
    const acha = alvos => cab.findIndex(c => alvos.some(a => c.includes(a)));
    const d = acha(['data','dt ','lançamento','lancamento']);
    const i = acha(['identific','descri','histór','histor','memo','detalhe']);
    const v = acha(['valor','montante','crédito','credito','r$']);
    if (d >= 0 && v >= 0){ iD = d; iI = i; iV = v; ini = r+1; break; }
  }
  if (iD < 0){ iD = 0; iI = 1; iV = 2; ini = 0; }
  const out = [];
  for (let r=ini; r<rows.length; r++){
    const row = rows[r] || [];
    const data = isoDe(row[iD]);
    const valor = n(row[iV]);
    if (!data || !valor) continue;
    out.push({DATA:data, IDENTIFICACAO:String(iI >= 0 ? (row[iI]||'') : '').trim(), VALOR:rd(valor)});
  }
  return out;
}
async function textoPDF(f){
  if (typeof pdfjsLib === 'undefined') throw new Error('leitor de PDF indisponível — verifique a conexão.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  let txt = '';
  for (let p=1; p<=doc.numPages; p++){
    const c = await (await doc.getPage(p)).getTextContent();
    let y = null, linha = [];
    c.items.forEach(it => {
      const ny = Math.round(it.transform[5]);
      if (y !== null && Math.abs(ny - y) > 3){ txt += linha.join(' ') + '\n'; linha = []; }
      y = ny; linha.push(it.str);
    });
    txt += linha.join(' ') + '\n';
  }
  return txt;
}
function parseLinhas(txt){
  const out = [];
  txt.split(/\r?\n/).forEach(l => {
    const linha = l.replace(/\s+/g,' ').trim(); if (!linha) return;
    const md = linha.match(/(\d{2}[\/.-]\d{2}[\/.-]\d{2,4})/); if (!md) return;
    const valores = linha.match(/-?\s?R?\$?\s?\d{1,3}(?:\.\d{3})*,\d{2}(?:\s?[DC])?/g);
    if (!valores) return;
    const bruto = valores[valores.length-1];
    let v = n(bruto);
    if (/D\s*$/.test(bruto.trim()) || /^-/.test(bruto.trim())) v = -Math.abs(v);
    const desc = linha.replace(md[0],'').replace(bruto,'').replace(/\s+/g,' ').trim();
    const data = isoDe(md[0]);
    if (data && v) out.push({DATA:data, IDENTIFICACAO:desc.slice(0,120), VALOR:rd(v)});
  });
  return out;
}
function lerColado(){
  const txt = (document.getElementById('impTexto')||{}).value || '';
  if (!txt.trim()){ toast('Cole o extrato na caixa de texto.','erro'); return; }
  try{

    if (!linhas.length){
      $('#impPrevia').innerHTML = '<div class="erro">Nenhum movimento reconhecido. Cada linha precisa de uma data e um valor — por exemplo: 03/09/2026 TED RECEBIDA 1.000,00</div>';
      $('#btnImp').disabled = true; return;
    }
    IMP_BRUTO = linhas; previaImport();
  }catch(e){ $('#impPrevia').innerHTML = '<div class="erro">'+esc(e.message)+'</div>'; }
}
function parseColado(txt){
  const linhas = txt.split(/\r?\n/).filter(l => l.trim());
  const sep = linhas.filter(l => l.includes('\t')).length >= linhas.length/2 ? '\t'
            : linhas.filter(l => l.includes(';')).length >= linhas.length/2 ? ';' : null;
  if (sep){
    const rows = linhas.map(l => l.split(sep).map(c => c.replace(/^"|"$/g,'').trim()));
    const r = parseTabela(rows);
    if (r.length) return r;
  }
  const r2 = parseLinhas(txt);
  if (r2.length) return r2;
  // último recurso: separado por 2+ espaços
  const rows = linhas.map(l => l.trim().split(/\s{2,}/));
  return parseTabela(rows);
}

/* ══════════════════ CONTAS A PAGAR ══════════════════ */
/* Um repasse ao cliente só pode ser pago depois que a parcela correspondente for conciliada.
   O sinal é lido da própria parcela, então nunca sai do lugar. */
function liberacao(c){
  if (!c.PARCELA_ID) return {tipo:'na'};
  const p = parcDe(c.PARCELA_ID);
  if (!p) return {tipo:'na'};
  return p.STATUS === 'Recebida'
    ? {tipo:'ok', p, titulo:'Recebido em ' + dataBR(p.DATA_CREDITO) + ' — liberado para pagamento'}
    : {tipo:'nao', p, titulo:'Parcela ainda não conciliada — aguardando o crédito de ' + moeda(p.VALOR)};
}
function selo(c){
  const s = liberacao(c);
  if (s.tipo === 'na') return '<span class="mini">—</span>';
  return s.tipo === 'ok'
    ? '<span class="selo ok" title="'+esc(s.titulo)+'">✓</span>'
    : '<span class="selo nao" title="'+esc(s.titulo)+'">✕</span>';
}
function telaPagar(){
  const t = FILTROS.busca, mes = FILTROS.fMesP || '', st = FILTROS.fStP || '';
  const hj = hoje();
  const L = (DB.CONTAS_PAGAR||[])
    .filter(c => casa(c, ['DESCRICAO','FAVORECIDO','CATEGORIA'], t))
    .filter(c => !mes || mesDe(c.VENCIMENTO) === mes)
    .filter(c => !st || c.STATUS === st)
    .filter(c => !FILTROS.fLib || (FILTROS.fLib === 'nao' ? liberacao(c).tipo === 'nao' : liberacao(c).tipo !== 'nao'))
    .sort((a,b) => String(a.VENCIMENTO).localeCompare(String(b.VENCIMENTO)));
  const abertas = L.filter(c => c.STATUS !== 'Pago');
  const pagas = L.filter(c => c.STATUS === 'Pago');
  const atraso = abertas.filter(c => c.VENCIMENTO < hj && liberacao(c).tipo !== 'nao');
  const liberadas = abertas.filter(c => liberacao(c).tipo !== 'nao');
  const travadas = abertas.filter(c => liberacao(c).tipo === 'nao');

  return cabec('Contas a pagar', '✕ = a parcela do cliente ainda não caiu. ✓ = já recebemos e o repasse pode ser pago. A baixa é feita conciliando o débito no extrato.',
      '<button class="btn" onclick="formCP()">Nova conta</button>'
    + '<button class="btn sec" onclick="exportarCSV(\'contas-a-pagar\')">Exportar CSV</button>')
    + '<div class="kpis">'
    + kpi('Em aberto', moeda(abertas.reduce((s,c)=>s+n(c.VALOR),0)), abertas.length + ' conta(s)', 'b')
    + kpi('Vencidas', moeda(atraso.reduce((s,c)=>s+n(c.VALOR),0)), atraso.length + ' em atraso', atraso.length ? 'n' : '')
    + kpi('Liberadas para pagamento', moeda(liberadas.reduce((s,c)=>s+n(c.VALOR),0)), liberadas.length + ' conta(s) com ✓', 'p')
    + kpi('Aguardando recebimento', moeda(travadas.reduce((s,c)=>s+n(c.VALOR),0)), travadas.length + ' repasse(s) com ✕', travadas.length ? 'n' : '')
    + '</div>'
    + '<div class="filtros">' + campoBusca('Descrição, favorecido…') + selMes('fMesP', mes)
    + sel('fStP','Situação',[['','Todas'],['Em aberto','Em aberto'],['Pago','Pago']], st,'','onchange="setF(\'fStP\',this.value)"')
    + sel('fLib','Liberação',[['','Todas'],['ok','Liberadas ✓'],['nao','Aguardando ✕']], FILTROS.fLib||'','','onchange="setF(\'fLib\',this.value)"') + '</div>'
    + '<div class="card"><div class="tw"><table><thead><tr><th style="text-align:center">Recebido</th><th>Vencimento</th><th>Descrição</th><th>Favorecido</th>'
    + '<th>Categoria</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>'
    + (L.length ? L.map(c => '<tr'+(c.STATUS!=='Pago' && c.VENCIMENTO<hj && liberacao(c).tipo!=='nao' ? ' class="grifo"' : '')+'>'
      + '<td style="text-align:center">'+selo(c)+'</td>'
      + '<td>'+dataBR(c.VENCIMENTO)+'</td><td>'+esc(c.DESCRICAO)
      + (c.ORIGEM && c.ORIGEM !== 'Manual' ? '<div class="mini">'+esc(c.ORIGEM)+'</div>' : '') + '</td>'
      + '<td>'+esc(c.FAVORECIDO||'—')+'</td><td>'+esc(c.CATEGORIA||'—')+'</td><td class="num">'+nMoeda(c.VALOR)+'</td>'
      + '<td><span class="tag '+(c.STATUS==='Pago'?'t-ok':'t-pend')+'">'+esc(c.STATUS)+(c.DATA_PGTO?' '+dataBR(c.DATA_PGTO):'')+'</span></td>'
      + '<td style="text-align:right;white-space:nowrap">'
      + (c.STATUS==='Pago'
          ? '<span class="mini">baixado pelo extrato</span>'
          : '<button class="btn sm sec" onclick="formCP(\''+c.ID+'\')">Editar</button> '
            + '<button class="btn sm per" onclick="apagarSimples(\'CONTAS_PAGAR\',\''+c.ID+'\')">Excluir</button>')
      + '</td></tr>').join('')
      : '<tr><td colspan="8">'+vazio('Nenhuma conta a pagar','O repasse ao cliente entra aqui já no lançamento do acordo, com ✕, e ganha o ✓ quando a parcela é conciliada.')+'</td></tr>')
    + '</tbody></table></div></div>';
}

  const todas = (DB.COMISSOES||[]).filter(c => !mes || mesDe(c.DATA) === mes);

    const l = lancDe(p.LANC_ID);
    return {p, l, data:p.DATA_CREDITO, cliente:l.CLIENTE||'—', pasta:l.PASTA||'—', sub:l.SUBCLASSE||'—',

            base:rd(n(p.VALOR_ESCRITORIO) - n(p.TARIFA)),

    if (c.STATUS !== 'Paga') porCom[c.COMISSIONADO_ID].ab += n(c.VALOR); });

  const cabecalho = '<tr><th>Crédito</th><th>Pasta / cliente</th><th>Subclasse</th>'
    + '<th class="num">Caiu na conta</th><th class="num">Para o escritório</th><th class="num">Base da comissão</th>'

    + '<td class="num">'+nMoeda(r.base)+'</td>'
    + coms.map(c => { const it = r.itens.find(x => x.COMISSIONADO_ID === c.ID);
        return '<td class="num">' + (it ? nMoeda(it.VALOR) + '<div class="mini">' + nMoeda(it.PCT) + '%'
          + (it.STATUS === 'Paga' ? ' · paga' : '') + '</div>' : '<span class="mini">—</span>') + '</td>'; }).join('')
    + '</tr>').join('')
    : '<tr><td colspan="'+(6+coms.length)+'">'+vazio('Sem comissões no período','As comissões são geradas na conciliação, conforme as regras por subclasse.')+'</td></tr>';

  const rodape = recs.length ? '<tfoot><tr><th colspan="3" style="text-align:right">Totais</th>'
    + '<th class="num">'+nMoeda(recs.reduce((s,r)=>s+r.caiu,0))+'</th>'
    + '<th class="num">'+nMoeda(recs.reduce((s,r)=>s+r.esc,0))+'</th>'
    + '<th class="num">'+nMoeda(recs.reduce((s,r)=>s+r.base,0))+'</th>'
    + coms.map(c => '<th class="num">'+nMoeda(recs.reduce((s,r)=>s+n((r.itens.find(x=>x.COMISSIONADO_ID===c.ID)||{}).VALOR),0))+'</th>').join('')
    + '</tr></tfoot>' : '';

    + '<div class="kpis">'
    + coms.slice(0,4).map(c => kpi(c.NOME, moeda((porCom[c.ID]||{}).t || 0), moeda((porCom[c.ID]||{}).ab || 0) + ' em aberto', 'b')).join('')
    + '</div>'
    + '<div class="filtros">' + campoBusca('Cliente, pasta, subclasse…') + selMes('fMesC', mes) + '</div>'
    + (coms.length
      ? '<div class="card"><div class="tw"><table><thead>'+cabecalho+'</thead><tbody>'+linhas+'</tbody>'+rodape+'</table></div></div>'
      : '<div class="card">'+vazio('Nenhum comissionado cadastrado','Cadastre os comissionados e as regras por subclasse na engrenagem.')+'</div>');

async function gerarCPComissoes(){
  const pend = (DB.COMISSOES||[]).filter(c => c.STATUS !== 'Paga' && !c.CP_ID);
  if (!pend.length) return toast('Nenhuma comissão pendente de envio.','erro');
  if (!confirm('Gerar '+pend.length+' conta(s) a pagar de comissão?')) return;
  const lote = [];
  pend.forEach(c => {
    const cpId = uid('cp');
    lote.push({aba:'CONTAS_PAGAR', registro:{ID:cpId, DESCRICAO:'Comissão — '+(c.CLIENTE||''),

      VALOR:n(c.VALOR), STATUS:'Em aberto', DATA_PGTO:'', ORIGEM:'Comissão automática', PARCELA_ID:c.PARCELA_ID,
      ANEXO_URL:'', OBS:nMoeda(c.PCT)+'% sobre '+moeda(c.BASE)}});
    lote.push({aba:'COMISSOES', registro: Object.assign({}, c, {CP_ID:cpId, STATUS:'Enviada'})});

  carregandoOn('Gerando contas a pagar…');
  try{ await salvarLote(lote); render(); toast(pend.length+' comissão(ões) enviada(s) para contas a pagar.','ok'); }
  catch(e){ toast(e.message,'erro'); } finally{ carregandoOff(); }
}

/* ══════════════════ PAINEL E DRE ══════════════════ */
function telaPainel(){
  const mes = FILTROS.fMesD || mesDe(hoje());
  const noMes = d => !mes || mesDe(d) === mes;

  const recb = (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida' && noMes(p.DATA_CREDITO));
  const tarifas = recb.reduce((s,p) => s + n(p.TARIFA), 0);
  const hon = recb.filter(p => p.TIPO !== 'Sucumbência').reduce((s,p) => s + n(p.VALOR_ESCRITORIO) - n(p.TARIFA), 0);
  const suc = recb.filter(p => p.TIPO === 'Sucumbência').reduce((s,p) => s + n(p.VALOR_ESCRITORIO), 0);
  const outras = (DB.CONTAS_RECEBER||[]).filter(c => c.STATUS === 'Recebido' && noMes(c.DATA_RECEB)).reduce((s,c) => s + n(c.VALOR), 0);
  const repasses = recb.reduce((s,p) => s + n(p.VALOR_CLIENTE), 0);
  const bruta = hon + suc + tarifas + outras;

  const desp = {};
  (DB.CONTAS_PAGAR||[]).filter(c => c.CATEGORIA !== 'Repasse a cliente' && noMes(c.VENCIMENTO))
    .forEach(c => { desp[c.CATEGORIA || 'Outras despesas'] = (desp[c.CATEGORIA||'Outras despesas'] || 0) + n(c.VALOR); });
  const totDesp = Object.values(desp).reduce((s,v) => s + v, 0);
  const resultado = bruta - totDesp;

  const aberto = pendentesReceber();
  const escAberto = aberto.reduce((s,p) => { const l = lancDe(p.LANC_ID);
    return s + rd(n(p.VALOR)*n(l.PCT_ESCRITORIO)/100 + tarifaDe(p,l)); }, 0);
  const cpAberto = (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS !== 'Pago').reduce((s,c) => s + n(c.VALOR), 0);
  const pendConc = (DB.EXTRATO||[]).filter(m => m.STATUS !== 'Conciliado').length;

  const li = (rot, v, cls) => '<tr class="'+(cls||'')+'"><td>'+esc(rot)+'</td><td class="num'+(n(v)<0?' neg':'')+'">'+nMoeda(v)+'</td></tr>';

  return cabec('Painel e DRE', 'Resultado por regime de caixa. Repasses aos clientes são recursos de terceiros e ficam fora do resultado.',
      '<button class="btn sec" onclick="exportarCSV(\'dre\')">Exportar CSV</button>')
    + '<div class="filtros">' + selMes('fMesD', mes) + '</div>'
    + '<div class="kpis">'
    + kpi('Receita do escritório', moeda(bruta), mes ? mesBR(mes) : 'todo o período', 'p')
    + kpi('Despesas', moeda(totDesp), 'sem repasses a clientes', 'n')
    + kpi('Resultado', moeda(resultado), resultado >= 0 ? 'superávit' : 'déficit', resultado >= 0 ? 'p' : 'n')
    + kpi('A conciliar', pendConc, 'movimentos do banco em aberto', pendConc ? 'b' : '')
    + '</div>'
    + '<div class="kpis">'
    + kpi('A receber (escritório)', moeda(escAberto), aberto.length + ' parcela(s) em aberto', 'd')
    + kpi('A pagar', moeda(cpAberto), 'contas em aberto', 'b')
    + kpi('Repasses do mês', moeda(repasses), 'devidos aos clientes', '')
    + kpi('Tarifas do mês', moeda(tarifas), 'do cliente para o escritório', '')
    + '</div>'
    + '<div class="card"><h3>Demonstração do resultado — '+(mes ? mesBR(mes) : 'todo o período')+'</h3><div class="tw">'
    + '<table class="dre"><tbody>'
    + li('Receita bruta', bruta, 'nivel1')
    + li('Honorários contratuais (parte do escritório)', hon, 'recuo')
    + li('Honorários de sucumbência', suc, 'recuo')
    + li('Tarifas bancárias repassadas ao escritório', tarifas, 'recuo')
    + li('Outras receitas', outras, 'recuo')
    + li('Despesas operacionais', -totDesp, 'nivel1')
    + Object.keys(desp).sort().map(k => li(k, -desp[k], 'recuo')).join('')
    + li('Resultado do período', resultado, 'total')
    + '</tbody></table></div>'
    + '<div class="corpo" style="border-top:1px solid var(--line2)">'
    + '<h3 style="border:0;padding:0 0 8px;font-size:12px;color:var(--ink2)">Contas de terceiros (fora do resultado)</h3>'
    + '<table class="dre"><tbody>' + li('Repasses devidos aos clientes no período', repasses)
    + '</tbody></table></div></div>'
    + graficoMeses();
}
function graficoMeses(){
  const meses = {};
  (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida' && p.DATA_CREDITO).forEach(p => {
    const m = mesDe(p.DATA_CREDITO); meses[m] = (meses[m] || 0) + n(p.VALOR_ESCRITORIO);
  });
  const ks = Object.keys(meses).sort().slice(-12);
  if (!ks.length) return '';
  const max = Math.max(...ks.map(k => meses[k]));
  return '<div class="card"><h3>Receita do escritório por mês</h3><div class="corpo">'
    + ks.map(k => '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px">'
      + '<span>'+mesBR(k)+'</span><span class="num">'+moeda(meses[k])+'</span></div>'
      + '<div class="barra"><i style="width:'+Math.round(meses[k]/max*100)+'%"></i></div></div>').join('')
    + '</div></div>';
}

/* ══════════════════ EXPORTAÇÃO ══════════════════ */
function exportarCSV(qual){
  let cab = [], linhas = [];
  if (qual === 'contas-a-receber'){
    cab = ['Vencimento','Pasta','Cliente','Processo','Descrição','Valor','Cliente R$','Escritório R$'];
    pendentesReceber().sort((a,b)=>String(a.VENCIMENTO).localeCompare(String(b.VENCIMENTO))).forEach(p => {
      const l = lancDe(p.LANC_ID);
      const tf = tarifaDe(p, l);
      linhas.push([dataBR(p.VENCIMENTO), l.PASTA, l.CLIENTE, l.N_PROCESSO, p.TIPO+(p.NUM>0?' '+p.NUM:''),
        nMoeda(p.VALOR), nMoeda(n(p.VALOR)*n(l.PCT_CLIENTE)/100 - tf), nMoeda(n(p.VALOR)*n(l.PCT_ESCRITORIO)/100 + tf)]);
    });
  } else if (qual === 'contas-recebidas'){
    cab = ['Crédito','Pasta','Cliente','Descrição','Valor','Cliente','Tarifa','Escritório'];
    (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida').forEach(p => {
      const l = lancDe(p.LANC_ID);
      linhas.push([dataBR(p.DATA_CREDITO), l.PASTA, l.CLIENTE, p.TIPO+(p.NUM>0?' '+p.NUM:''),
        nMoeda(p.VALOR_CREDITADO||p.VALOR), nMoeda(p.VALOR_CLIENTE), nMoeda(p.TARIFA), nMoeda(p.VALOR_ESCRITORIO)]);
    });
  } else if (qual === 'contas-a-pagar'){
    cab = ['Recebido do cliente','Vencimento','Descrição','Favorecido','Categoria','Valor','Situação','Pagamento'];
    (DB.CONTAS_PAGAR||[]).forEach(c => { const lb = liberacao(c);
      linhas.push([lb.tipo === 'na' ? '' : (lb.tipo === 'ok' ? 'SIM' : 'NAO'), dataBR(c.VENCIMENTO), c.DESCRICAO,
        c.FAVORECIDO, c.CATEGORIA, nMoeda(c.VALOR), c.STATUS, dataBR(c.DATA_PGTO)]); });
  } else {
    cab = ['Mês','Receita escritório','Repasses a clientes','Tarifas'];
    const M = {};
    (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida').forEach(p => {
      const m = mesDe(p.DATA_CREDITO); M[m] = M[m] || [0,0,0];
      M[m][0] += n(p.VALOR_ESCRITORIO); M[m][1] += n(p.VALOR_CLIENTE); M[m][2] += n(p.TARIFA);
    });
    Object.keys(M).sort().forEach(m => linhas.push([mesBR(m), nMoeda(M[m][0]), nMoeda(M[m][1]), nMoeda(M[m][2])]));
  }
  const csv = [cab].concat(linhas).map(l => l.map(c => '"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = qual + '-' + hoje() + '.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('Arquivo gerado.','ok');
}
